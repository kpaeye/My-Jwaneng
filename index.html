<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Jwaneng</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">

<meta name="theme-color" content="#0b1f3a">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ================= GLOBAL ================= */
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:#000814;
    color:#fff;
    padding-top:120px;
    padding-bottom:70px;
}

/* ================= NAVBAR ================= */
.navbar{
    width:100%;
    padding:18px 8%;
    background:rgba(0,31,63,0.92);
    position:fixed;
    top:0;
    z-index:10000;
}

.logo{
    font-size:28px;
    font-weight:700;
}
.logo span{color:#4fc3f7;}

/* ================= UPDATE BAR ================= */
.update-bar{
    width:100%;
    display:flex;
    align-items:center;
    background:linear-gradient(90deg,#4fc3f7,#001f3f);
    position:fixed;
    top:70px;
    z-index:9999;
}

.update-label{
    padding:12px 15px;
    background:rgba(0,0,0,0.3);
    font-weight:700;
}

.update-marquee{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
}

.update-track{
    display:inline-block;
    animation:scrollUpdate 25s linear infinite;
}

/* ================= HERO ================= */
.hero{
    min-height:80vh;
    display:flex;
    justify-content:space-between;
    padding:40px 8%;
    flex-wrap:wrap;
}

.hero-text{flex:1;}
.hero-text h1{font-size:48px;}
.hero-text span{color:#4fc3f7;}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 18px;
    background:#4fc3f7;
    color:#001f3f;
    font-weight:700;
    border-radius:10px;
    text-decoration:none;
}

/* ================= WIDGETS ================= */
.widgets-section{
    padding:60px 8%;
}

.widgets-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.widget-card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(79,195,247,0.2);
    padding:20px;
    border-radius:14px;
}

.widget-card h3{
    color:#4fc3f7;
    margin-bottom:15px;
}

.widget-item{
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

.widget-item:last-child{border:none;}

.widget-item small{color:#bbb;display:block;}

.widget-btn{
    display:inline-block;
    margin-top:15px;
    color:#4fc3f7;
    text-decoration:none;
}

/* ================= DID YOU KNOW ================= */
.didyouknow{
    padding:60px 8%;
}

/* ================= FOOTER ================= */
footer{
    padding:60px 8%;
    background:#001f3f;
    text-align:center;
}

/* ================= ANIMATIONS ================= */
@keyframes scrollUpdate{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}

</style>
</head>

<body>

<div class="navbar">
    <div class="logo">My<span>Jwaneng</span></div>
</div>

<!-- UPDATE BAR -->
<div class="update-bar">
    <div class="update-label">📢 Live Updates</div>
    <div class="update-marquee">
        <div class="update-track" id="updateTrack">Loading...</div>
    </div>
</div>

<!-- HERO -->
<section class="hero">
    <div class="hero-text">
        <h1>Connecting <span>Jwaneng</span></h1>
        <p>Your community hub for jobs, news, events and opportunities.</p>
        <a href="#" class="btn">Explore</a>
    </div>
</section>

<!-- WIDGETS -->
<section class="widgets-section">

    <div class="widgets-grid">

        <!-- NEWS -->
        <div class="widget-card">
            <h3>📰 Latest News</h3>
            <div id="latestNews">Loading...</div>
            <a class="widget-btn" href="townnews.html">View All</a>
        </div>

        <!-- JOBS -->
        <div class="widget-card">
            <h3>💼 Latest Jobs</h3>
            <div id="latestJobs">Loading...</div>
            <a class="widget-btn" href="jobs.html">View All</a>
        </div>

        <!-- EVENTS -->
        <div class="widget-card">
            <h3>📅 Upcoming Events</h3>
            <div id="latestEvents">Loading...</div>
            <a class="widget-btn" href="events.html">View All</a>
        </div>

    </div>

</section>

<!-- DID YOU KNOW -->
<section class="didyouknow">
    <h2 style="color:#4fc3f7;">🧠 Did You Know?</h2>
</section>

<footer>
© 2026 My Jwaneng
</footer>

<script>

const client = supabase.createClient(
"https://jxigyoxikaqwwzfnccej.supabase.co",
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";
);

/* ================= UPDATES (NO TIMEOUT) ================= */
async function loadUpdates(){
    const { data } = await client.from("updates").select("*");

    if(!data || data.length === 0){
        updateTrack.innerHTML = "📢 Welcome to My Jwaneng";
        return;
    }

    const content = data.map(u =>
        `<span style="margin-right:80px;">📢 ${u.message}</span>`
    ).join("");

    updateTrack.innerHTML = content + content;
}

/* ================= NEWS ================= */
async function loadLatestNews(){
    const { data } = await client.from("news").select("*").order("id",{ascending:false}).limit(3);

    latestNews.innerHTML = (data||[]).map(n=>`
        <div class="widget-item">
            <strong>${n.title}</strong>
            <small>${n.category||""}</small>
        </div>
    `).join("");
}

/* ================= JOBS ================= */
async function loadLatestJobs(){
    const { data } = await client.from("jobs").select("*").order("id",{ascending:false}).limit(3);

    latestJobs.innerHTML = (data||[]).map(j=>`
        <div class="widget-item">
            <strong>${j.title}</strong>
            <small>${j.company||""}</small>
        </div>
    `).join("");
}

/* ================= EVENTS ================= */
async function loadLatestEvents(){
    const { data } = await client.from("events").select("*").order("event_date",{ascending:true}).limit(3);

    latestEvents.innerHTML = (data||[]).map(e=>`
        <div class="widget-item">
            <strong>${e.title}</strong>
            <small>${e.event_date||""}</small>
        </div>
    `).join("");
}

/* INIT */
loadUpdates();
loadLatestNews();
loadLatestJobs();
loadLatestEvents();

</script>

</body>
</html>
