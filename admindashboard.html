<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Jwaneng Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #f4f6f9;
}

.sidebar {
  width: 220px;
  background: #0b1f3a;
  color: white;
  height: 100vh;
  padding: 20px;
  position: fixed;
}

.sidebar a {
  display: block;
  color: white;
  padding: 10px;
  margin-bottom: 5px;
  cursor: pointer;
  text-decoration: none;
  border-radius: 6px;
}

.sidebar a:hover { background: #1d3b66; }

.main {
  margin-left: 240px;
  padding: 20px;
  width: 100%;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  margin: 6px 0 12px;
  border: 1px solid #ddd;
  border-radius: 6px;
}

button {
  background: #0b1f3a;
  color: white;
  padding: 8px 12px;
  border: none;
  cursor: pointer;
  border-radius: 5px;
  margin-right: 5px;
}

button:hover { background: #174a8b; }

.hidden { display: none; }

.item {
  padding: 10px;
  border-bottom: 1px solid #eee;
}

.small-btn {
  font-size: 12px;
  padding: 5px 8px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Admin</h2>
  <a onclick="showSection('news')">News</a>
  <a onclick="showSection('updates')">Updates</a>
  <a onclick="showSection('events')">Events</a>
  <a onclick="showSection('jobs')">Jobs</a>
  <a onclick="showSection('marketplace')">Marketplace</a>
  <a onclick="showSection('businesses')">Businesses</a>
</div>

<div class="main">

<!-- NEWS -->
<div id="news" class="section">
  <div class="card">
    <h3>Add News</h3>
    <input id="news_title" placeholder="Title">
    <input id="news_category" placeholder="Category">
    <textarea id="news_summary" placeholder="Summary"></textarea>
    <textarea id="news_content" placeholder="Content"></textarea>
    <input id="news_image" placeholder="Image URL">
    <input id="news_author" placeholder="Author">
    <button onclick="addNews()">Publish</button>
  </div>
  <div class="card"><h3>News List</h3><div id="newsList"></div></div>
</div>

<!-- UPDATES -->
<div id="updates" class="section hidden">
  <div class="card">
    <h3>Add Update</h3>
    <select id="update_type">
      <option>alert</option>
      <option>announcement</option>
      <option>notice</option>
    </select>
    <textarea id="update_message" placeholder="Message"></textarea>
    <button onclick="addUpdate()">Post</button>
  </div>
  <div class="card"><h3>Updates</h3><div id="updateList"></div></div>
</div>

<!-- EVENTS -->
<div id="events" class="section hidden">
  <div class="card">
    <h3>Add Event</h3>
    <input id="event_title" placeholder="Title">
    <input id="event_date" type="date">
    <input id="event_location" placeholder="Location">
    <textarea id="event_description" placeholder="Description"></textarea>
    <button onclick="addEvent()">Publish</button>
  </div>
  <div class="card"><h3>Events</h3><div id="eventList"></div></div>
</div>

<!-- JOBS -->
<div id="jobs" class="section hidden">
  <div class="card">
    <h3>Add Job</h3>
    <input id="job_title" placeholder="Job Title">
    <input id="job_company" placeholder="Company">
    <input id="job_location" placeholder="Location">
    <textarea id="job_description" placeholder="Description"></textarea>
    <input id="job_closing_date" type="date">
    <button onclick="addJob()">Post Job</button>
  </div>
  <div class="card"><h3>Jobs</h3><div id="jobList"></div></div>
</div>

<!-- MARKETPLACE -->
<div id="marketplace" class="section hidden">
  <div class="card">
    <h3>Add Marketplace Item</h3>

    <input id="mp_title" placeholder="Title">
    <input id="mp_price" placeholder="Price">
    <input id="mp_area" placeholder="Area / Location">
    <input id="mp_whatsapp" placeholder="WhatsApp Number (e.g. 2677XXXXXX)">
    <input id="mp_phone" placeholder="Call Number (optional)">
    <select id="mp_category">
      <option value="">Select Category</option>
      <option>electronics</option>
      <option>vehicles</option>
      <option>furniture</option>
      <option>fashion</option>
      <option>services</option>
      <option>property</option>
      <option>beauty care</option>
      <option>other</option>
    </select>

    <textarea id="mp_description" placeholder="Description"></textarea>

    <!-- MULTI IMAGE -->
    <input id="mp_images" type="file" multiple accept="image/*">

    <!-- VIDEO (OPTIONAL) -->
    <input id="mp_video" type="file" accept="video/*">

    <button onclick="addMarketplace()">Upload Item</button>
  </div>

  <div class="card">
    <h3>Pending Items</h3>
    <div id="mpList"></div>
  </div>
</div>

<!-- BUSINESSES -->
<div id="businesses" class="section hidden">
  <div class="card">
    <h3>Add Business</h3>

    <input id="biz_name" placeholder="Business Name">

    <select id="biz_category">
      <option value="">Select Category</option>
      <option>Restaurant</option>
      <option>Retail Shop</option>
      <option>Salon / Barber</option>
      <option>Health / Clinic</option>
      <option>Automotive</option>
      <option>Construction</option>
      <option>ICT / Tech</option>
      <option>Education</option>
      <option>Entertainment</option>
      <option>Accommodation</option>
      <option>Financial Services</option>
      <option>Professional Services</option>
      <option>Transport / Logistics</option>
      <option>Beauty / Wellness</option>
      <option>Food And Beverages</option>
      <option>Sports / Fitness</option>
      <option>Tourism / Travel</option>
      <option>Event Planning</option>
      <option>Media / Advertising</option>
      <option>Furniture</option>
      <option>Other</option>
    </select>

    <input id="biz_phone" placeholder="Phone Number">
    <textarea id="biz_description" placeholder="Description"></textarea>

    <input id="biz_facebook" placeholder="Facebook Link">
    <input id="biz_whatsapp" placeholder="WhatsApp Number">
    <input id="biz_photo" placeholder="Photo URL">

    <h4>Operating Hours</h4>
    <select id="biz_open_day">
      <option>Mon-Fri</option>
      <option>Mon-Sun</option>
      <option>Weekends Only</option>
      <option>Custom</option>
    </select>

    <input id="biz_open_time" type="time">
    <input id="biz_close_time" type="time">

    <button onclick="addBusiness()">Add Business</button>
  </div>

  <div class="card">
    <h3>Businesses</h3>
    <div id="bizList"></div>
  </div>
</div>

</div>

<script>
const supabaseUrl = "https://jxigyoxikaqwwzfnccej.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";
const client = supabase.createClient(supabaseUrl, supabaseKey);

/* GLOBAL FIX */
window.showSection = function(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
};

function val(id){
  return document.getElementById(id)?.value || "";
}

async function deleteRow(table,id){
  await client.from(table).delete().eq("id",id);
  location.reload();
}

/* =========================
UPDATES (FIXED)
========================= */

async function addUpdate(){
  await client.from("updates").insert([{
    type: val("update_type"),
    message: val("update_message"),
    created_at: new Date().toISOString()
  }]);

  loadUpdates();
}

async function loadUpdates(){
  let { data } = await client
    .from("updates")
    .select("*")
    .order("id",{ascending:false});

  updateList.innerHTML = (data || []).map(u => `
    <div class="item">
      <b>${u.type}</b><br>
      ${u.message}
    </div>
  `).join("");
}
/* =========================
NEWS 
========================= */
async function addNews(){
  await client.from("news").insert([{ 
    title: val("news_title"),
    category: val("news_category"),
    summary: val("news_summary"),
    content: val("news_content"),
    image_url: val("news_image"),
    author: val("news_author")
  }]);
  loadNews();
}

async function loadNews(){
  let { data } = await client.from("news").select("*").order("id",{ascending:false});
  newsList.innerHTML = (data||[]).map(n=>`
    <div class="item"><b>${n.title}</b><br>${n.summary}</div>
  `).join("");
}

/* =========================
JOBS
========================= */
async function addJob(){
  await client.from("jobs").insert([{ 
    title: val("job_title"),
    company: val("job_company"),
    location: val("job_location"),
    description: val("job_description"),
    closing_date: val("job_closing_date")
  }]);
  loadJobs();
}

async function loadJobs(){
  let { data } = await client.from("jobs").select("*").order("id",{ascending:false});
  jobList.innerHTML = (data||[]).map(j=>`
    <div class="item">
      <b>${j.title}</b> - ${j.company}<br>
      Closing: ${j.closing_date || "N/A"}
    </div>
  `).join("");
}

/* =========================
BUSINESSES
========================= */
async function addBusiness(){
  await client.from("businesses").insert([{ 
    name: val("biz_name"),
    category: val("biz_category"),
    phone: val("biz_phone"),
    description: val("biz_description"),
    facebook: val("biz_facebook"),
    whatsapp: val("biz_whatsapp"),
    photo_url: val("biz_photo"),
    open_days: val("biz_open_day"),
    open_time: val("biz_open_time"),
    close_time: val("biz_close_time")
  }]);
  loadBusinesses();
}

async function loadBusinesses(){
  let { data } = await client.from("businesses").select("*").order("id",{ascending:false});
  bizList.innerHTML = (data||[]).map(b=>`
    <div class="item">
      <b>${b.name}</b> - ${b.category}<br>
      📞 ${b.phone || ""}<br>
      🕒 ${b.open_days || ""} ${b.open_time || ""} - ${b.close_time || ""}
    </div>
  `).join("");
}

/* =========================
🔥 MARKETPLACE
========================= */

async function loadMarketplace(){

  let { data } = await client
    .from("marketplace_items")
    .select("*")
    .eq("status","pending")
    .order("created_at",{ascending:false});

  mpList.innerHTML = (data || []).map(item => {

    let images = (item.images || [])
      .map(img => `<img src="${img}" style="width:60px;height:60px;object-fit:cover;margin:2px;border-radius:6px;">`)
      .join("");

    let video = item.video
      ? `<video src="${item.video}" width="120" controls></video>`
      : "";

    return `
      <div class="item">
        <b>${item.title}</b><br>
        💰 P${item.price || 0}<br>
        📍 ${item.area || ""}<br>
        📦 ${item.category || ""}<br>

        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">
          ${images}
        </div>

        ${video}

        <br><br>
        <button onclick="approveItem('${item.id}')">Approve</button>
        <button onclick="rejectItem('${item.id}')">Reject</button>
      </div>
    `;
  }).join("");
}

async function approveItem(id){
  await client
    .from("marketplace_items")
    .update({ status:"active" })
    .eq("id",id);

  loadMarketplace();
}

async function rejectItem(id){
  await client
    .from("marketplace_items")
    .delete()
    .eq("id",id);

  loadMarketplace();
}

/* INIT */
window.onload = () => {
  loadNews();
  loadJobs();
  loadBusinesses();
  loadMarketplace(); 
};
async function uploadImage(file){

  const fileName = Date.now() + "_" + file.name;

  const { error } = await client
    .storage
    .from("marketplace-media")
    .upload("images/" + fileName, file);

  if(error) return null;

  return client.storage
    .from("marketplace-media")
    .getPublicUrl("images/" + fileName)
    .data.publicUrl;
}
async function uploadVideo(file){

  const fileName = Date.now() + "_" + file.name;

  const { error } = await client
    .storage
    .from("marketplace-media")
    .upload("videos/" + fileName, file);

  if(error) return null;

  return client.storage
    .from("marketplace-media")
    .getPublicUrl("videos/" + fileName)
    .data.publicUrl;
}
async function addMarketplace(){

  let imagesFiles = document.getElementById("mp_images").files;
  let videoFile = document.getElementById("mp_video").files[0];

  let imageUrls = [];

  // UPLOAD IMAGES
  for(let file of imagesFiles){
    let url = await uploadImage(file);
    if(url) imageUrls.push(url);
  }

  // UPLOAD VIDEO
  let videoUrl = "";
  if(videoFile){
    videoUrl = await uploadVideo(videoFile);
  }

  // SAVE TO DATABASE
  await client.from("marketplace_items").insert([{
    title: val("mp_title"),
    price: val("mp_price"),
    area: val("mp_area"),
    category: val("mp_category"),
    description: val("mp_description"),
    images: imageUrls,
    video: videoUrl,
    status: "pending",
    created_at: new Date().toISOString()
  }]);

  alert("Item submitted for approval");

  loadMarketplace();
}

</script>

</body>
</html>
