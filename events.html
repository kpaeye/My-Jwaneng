<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Events - My Jwaneng</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f7fb;
}

/* NAV */
.navbar{
    background:#001f3f;
    color:white;
    padding:16px 8%;
    font-size:20px;
    font-weight:700;
}

/* HEADER */
.header{
    padding:20px 8%;
    text-align:center;
}
.header h1{color:#001f3f;}
.header p{color:#666;font-size:13px;}

/* FILTERS (NEW CATEGORY BAR) */
.filters{
    padding:10px 8%;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}

.filter-btn{
    padding:7px 14px;
    border:none;
    border-radius:20px;
    background:#e6e9ef;
    cursor:pointer;
    font-size:12px;
    font-weight:500;
}

.filter-btn.active{
    background:#001f3f;
    color:white;
}

/* GRID */
.grid{
    padding:20px 8%;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:16px;
}

/* CARD */
.card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 6px 16px rgba(0,0,0,0.08);
}

.card img{
    width:100%;
    height:110px;
    object-fit:cover;
}

.card-content{
    padding:10px;
}

.date{
    font-size:10px;
    background:#001f3f;
    color:white;
    display:inline-block;
    padding:3px 8px;
    border-radius:10px;
    margin-bottom:6px;
}

.title{
    font-size:14px;
    font-weight:600;
    color:#001f3f;
    margin-bottom:4px;
}

.desc{
    font-size:12px;
    color:#555;
    margin-bottom:6px;
}

.tag{
    font-size:10px;
    background:#eee;
    padding:3px 6px;
    border-radius:8px;
}

.btn{
    width:100%;
    padding:7px;
    margin-top:8px;
    background:#001f3f;
    color:white;
    border:none;
    border-radius:8px;
    font-size:11px;
    cursor:pointer;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-box{
    background:white;
    width:90%;
    max-width:520px;
    border-radius:14px;
    overflow:hidden;
    max-height:85vh;
    display:flex;
    flex-direction:column;
}

.modal-box img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.modal-content{
    padding:15px;
    overflow-y:auto;
}

.close-btn{
    width:100%;
    padding:10px;
    border:none;
    background:#001f3f;
    color:white;
    cursor:pointer;
    margin-top:10px;
    border-radius:8px;
}

/* FOOTER */
footer{
    margin-top:30px;
    background:#001f3f;
    color:white;
    text-align:center;
    padding:18px;
    font-size:13px;
}

</style>
</head>

<body>

<div class="navbar">My Jwaneng Events</div>

<div class="header">
    <h1>Upcoming Events</h1>
    <p>Discover what's happening in your town</p>
</div>

<!-- ================= CATEGORY FILTERS ================= -->
<div class="filters">
    <button class="filter-btn active" onclick="filterEvents('All', this)">All</button>
    <button class="filter-btn" onclick="filterEvents('Music', this)">Music</button>
    <button class="filter-btn" onclick="filterEvents('Sports', this)">Sports</button>
    <button class="filter-btn" onclick="filterEvents('Cultural', this)">Cultural</button>
    <button class="filter-btn" onclick="filterEvents('Business', this)">Business</button>
    <button class="filter-btn" onclick="filterEvents('Community', this)">Community</button>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="outsideClose(event)">
    <div class="modal-box">

        <img id="m_img">

        <div class="modal-content">

            <h2 id="m_title"></h2>
            <p id="m_date"></p>
            <p id="m_category"></p>
            <p id="m_location"></p>
            <p id="m_desc"></p>

            <button class="close-btn" onclick="closeModal()">Close</button>

        </div>

    </div>
</div>

<!-- FOOTER -->
<footer>
© 2026 My Jwaneng | Powered by A-eye Group
</footer>

<script>

const supabaseUrl = "https://jxigyoxikaqwwzfnccej.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";
const client = supabase.createClient(supabaseUrl, supabaseKey);

let allEvents = [];

/* ================= LOAD ================= */
async function loadEvents(){
    const { data } = await client.from("events").select("*");
    allEvents = data || [];
    render(allEvents);
}

/* ================= RENDER ================= */
function render(list){

    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    list.forEach(ev=>{

        const encoded = encodeURIComponent(JSON.stringify(ev));

        grid.innerHTML += `
        <div class="card">

            <img src="${ev.image_url || 'https://via.placeholder.com/400'}">

            <div class="card-content">

                <div class="date">${ev.date || ""}</div>
                <div class="title">${ev.title || ""}</div>
                <div class="desc">${(ev.description || "").substring(0,60)}...</div>
                <span class="tag">${ev.category || ""}</span>

                <button class="btn" onclick="openModal('${encoded}')">
                    View Details
                </button>

            </div>

        </div>`;
    });
}

/* ================= FILTER ================= */
function filterEvents(category, btn){

    document.querySelectorAll(".filter-btn")
        .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");

    if(category === "All"){
        render(allEvents);
        return;
    }

    render(allEvents.filter(e => e.category === category));
}

/* ================= MODAL ================= */
function openModal(encoded){

    const ev = JSON.parse(decodeURIComponent(encoded));

    document.getElementById("modal").style.display = "flex";

    document.getElementById("m_img").src = ev.image_url || "";
    document.getElementById("m_title").innerText = ev.title || "";
    document.getElementById("m_date").innerText = ev.date || "";
    document.getElementById("m_category").innerText = ev.category || "";
    document.getElementById("m_location").innerText = ev.location || "";
    document.getElementById("m_desc").innerText = ev.description || "";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

function outsideClose(e){
    if(e.target.id === "modal"){
        closeModal();
    }
}

/* ================= INIT ================= */
loadEvents();

</script>

</body>
</html>
