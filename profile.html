<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile - My Jwaneng</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins;
    background:#f4f6fb;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

input, textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ddd;
}

button{
    width:100%;
    padding:12px;
    background:#4fc3f7;
    border:none;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
}

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#ddd;
    margin-bottom:15px;
}

.badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:6px;
    background:#001f3f;
    color:white;
    font-size:12px;
}

</style>
</head>

<body>

<div class="container">

    <h2>My Profile</h2>

    <div id="profileBox">Loading...</div>

    <hr>

    <h3>Edit Profile</h3>

    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="location" placeholder="Location">
    <textarea id="bio" placeholder="Bio"></textarea>

    <button onclick="saveProfile()">Save Profile</button>

</div>
<script type="module">

import { supabase } from './supabase.js';

const {
    data: { session }
} = await supabase.auth.getSession();

if(!session){
    window.location.href = "login.html";
}

</script>
<script type="module">

import { getProfile, updateProfile } from './profile.js';

let profileData = null;

async function loadProfile(){

    profileData = await getProfile();

    document.getElementById("profileBox").innerHTML = `
        <div class="avatar"></div>
        <h3>${profileData.full_name || "No Name"}</h3>
        <p>${profileData.bio || "No bio yet"}</p>
        <span class="badge">${profileData.role}</span>
    `;

    document.getElementById("name").value = profileData.full_name || "";
    document.getElementById("location").value = profileData.location || "";
    document.getElementById("bio").value = profileData.bio || "";
}

window.saveProfile = async function(){

    const error = await updateProfile({
        full_name: document.getElementById("name").value,
        location: document.getElementById("location").value,
        bio: document.getElementById("bio").value
    });

    if(error){
        alert("Update failed");
    } else {
        alert("Profile updated");
        loadProfile();
    }
};

loadProfile();

</script>

</body>
</html>
