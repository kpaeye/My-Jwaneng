<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Jwaneng - Businesses</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ================= GLOBAL ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f7fb;
    color:#222;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-top:70px;
}

/* NAV */
.navbar{
    background:#001f3f;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    top:0;
    width:100%;
    z-index:1500;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:700;
}
.logo span{color:#4fc3f7;}

/* HEADER */
.biz-header{
    background:linear-gradient(to right,#001f3f,#003566);
    color:white;
    padding:60px 8%;
    text-align:center;
}

.add-btn{
    margin-top:20px;
    background:#4fc3f7;
    color:#001f3f;
    border:none;
    padding:12px 20px;
    font-weight:700;
    border-radius:10px;
    cursor:pointer;
}

/* CONTROLS */
.biz-controls{
    padding:20px 8%;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.search-box input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
}

.search-box button{
    padding:12px 18px;
    border:none;
    background:#001f3f;
    color:white;
    border-radius:10px;
    cursor:pointer;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.filters button{
    padding:8px 14px;
    border:none;
    border-radius:20px;
    background:white;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.filters button.active{
    background:#001f3f;
    color:white;
}

/* GRID */
.biz-grid{
    padding:20px 8% 80px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:18px;
}

/* CARD */
.biz-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
}

.biz-img{
    width:100%;
    height:150px;
}

.biz-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.biz-content{
    padding:12px;
}

.biz-name{
    font-weight:700;
    color:#001f3f;
}

.biz-category{
    font-size:12px;
    color:#4fc3f7;
    margin-bottom:6px;
}

.biz-details{
    font-size:12px;
    color:#555;
    line-height:1.6;
    margin-top:8px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    background:white;
    width:90%;
    max-width:500px;
    padding:20px;
    border-radius:12px;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
}

.submit-btn{
    width:100%;
    padding:12px;
    background:#001f3f;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
}

.cancel-btn{
    width:100%;
    padding:12px;
    margin-top:8px;
    background:#777;
    color:white;
    border:none;
    border-radius:8px;
}

</style>
</head>

<body>

<!-- NAV -->
<nav class="navbar">
    <div class="logo">My<span>Jwaneng</span></div>
</nav>

<!-- HEADER -->
<section class="biz-header">
    <h1>Local Businesses</h1>
    <p>Discover trusted businesses in Jwaneng</p>

</section>

<!-- CONTROLS -->
<section class="biz-controls">

    <div class="search-box">
        <input id="searchInput" placeholder="Search businesses...">
        <button onclick="searchBiz()">Search</button>
    </div>

    <div class="filters">
        <button class="active" onclick="filterCategory('All')">All</button>
        <button onclick="filterCategory('Construction')">Construction</button>
        <button onclick="filterCategory('Retail')">Retail</button>
        <button onclick="filterCategory('Food & Beverage')">Food & Beverage</button>
        <button onclick="filterCategory('Services')">Services</button>
        <button onclick="filterCategory('Transport')">Transport</button>
        <button onclick="filterCategory('Engineering')">Engineering</button>
        <button onclick="filterCategory('Hospitality')">Hospitality</button>
        <button onclick="filterCategory('Agriculture')">Agriculture</button>
        <button onclick="filterCategory('Health')">Health</button>
        <button onclick="filterCategory('Education')">Education</button>
    </div>

</section>

<!-- GRID -->
<div class="biz-grid" id="grid"></div>


<script>

const supabaseUrl = "https://jxigyoxikaqwwzfnccej.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let allBusinesses = [];

function openModal(){ document.getElementById("modal").style.display="flex"; }
function closeModal(){ document.getElementById("modal").style.display="none"; }

async function loadBusinesses(){
    const { data } = await supabaseClient.from("businesses").select("*");
    allBusinesses = data || [];
    render(allBusinesses);
}

function render(list){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    list.forEach(b => {

        const img = b.image_url || "https://via.placeholder.com/400";

        grid.innerHTML += `
        <div class="biz-card">

            <div class="biz-img">
                <img src="${img}">
            </div>

            <div class="biz-content">

                <div class="biz-name">${b.name || "No Name"}</div>
                <div class="biz-category">${b.category || ""}</div>

                <div class="biz-details">
                    📞 ${b.phone || "N/A"}<br>
                    📍 ${b.location || "N/A"}<br>
                    🌐 ${b.website || "N/A"}<br>
                    ✉️ ${b.email || "N/A"}<br>
                    💬 ${b.whatsapp || "N/A"}
                </div>

            </div>

        </div>`;
    });
}

function searchBiz(){
    const q = document.getElementById("searchInput").value.toLowerCase();
    render(allBusinesses.filter(b =>
        (b.name || "").toLowerCase().includes(q)
    ));
}

function filterCategory(cat){
    if(cat === "All") return render(allBusinesses);
    render(allBusinesses.filter(b => b.category === cat));
}

async function submitBusiness(){
    try {
        const file = document.getElementById("imageFile").files[0];
        let imageUrl = "";

        if(file){
            const fileName = `${Date.now()}-${file.name}`;

            const { error } = await supabaseClient.storage
                .from("business-images")
                .upload(fileName, file);

            if(error){
                alert("Image upload failed");
                return;
            }

            const { data } = supabaseClient.storage
                .from("business-images")
                .getPublicUrl(fileName);

            imageUrl = data.publicUrl;
        }

        const business = {
            name: document.getElementById("name").value,
            category: document.getElementById("category").value,
            phone: document.getElementById("phone").value,
            email: document.getElementById("email").value,
            website: document.getElementById("website").value,
            facebook: document.getElementById("facebook").value,
            whatsapp: document.getElementById("whatsapp").value,
            location: document.getElementById("location").value,
            description: document.getElementById("description").value,
            image_url: imageUrl
        };

        if(!business.name || !business.category){
            alert("Name and category required");
            return;
        }

        const { error } = await supabaseClient
            .from("businesses")
            .insert([business]);

        if(error){
            alert("Failed to save business");
            return;
        }

        alert("Business added successfully!");

        closeModal();
        loadBusinesses();

        document.querySelectorAll("#modal input, #modal textarea").forEach(i => i.value = "");
        document.getElementById("category").value = "";
        document.getElementById("imageFile").value = "";

    } catch(err){
        console.error(err);
        alert("Unexpected error");
    }
}

loadBusinesses();

</script>

</body>
</html>
