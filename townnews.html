<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Jwaneng - News Article</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="manifest"
    href="manifest.json"
>

<meta
    name="theme-color"
    content="#0b1f3a"
>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:#f4f6fb;

    color:#222;

    padding-bottom:70px;

}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{

    background:#001f3f;

    padding:16px 8%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    position:sticky;

    top:0;

    z-index:1000;

}

.logo{

    color:white;

    font-size:26px;

    font-weight:700;

}

.logo span{

    color:#4fc3f7;

}


/* =====================================================
   HEADER
===================================================== */

.news-header{

    background:
        linear-gradient(
            135deg,
            #001f3f,
            #003566
        );

    color:white;

    padding:40px 8%;

    text-align:center;

}

.news-header h1{

    font-size:34px;

    margin-bottom:8px;

}

.news-header p{

    max-width:700px;

    margin:auto;

    opacity:.9;

}


/* =====================================================
   ARTICLE CONTAINER
===================================================== */

.article-container{

    max-width:850px;

    margin:30px auto;

    padding:0 16px;

}


/* =====================================================
   ARTICLE CARD
===================================================== */

.article-card{

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 8px 25px rgba(0,0,0,.08);

}


/* =====================================================
   ARTICLE IMAGE
===================================================== */

.article-gallery{

    display:flex;

    overflow-x:auto;

    scroll-snap-type:x mandatory;

}

.article-gallery img{

    width:100%;

    height:420px;

    object-fit:cover;

    flex:0 0 100%;

    scroll-snap-align:start;

    cursor:pointer;

}


/* =====================================================
   ARTICLE CONTENT
===================================================== */

.article-content{

    padding:28px;

}

.category{

    display:inline-block;

    font-size:12px;

    padding:5px 12px;

    background:#eef6ff;

    color:#1a4d8f;

    border-radius:20px;

    margin-bottom:12px;

}

.article-title{

    font-size:32px;

    line-height:1.25;

    color:#001f3f;

    margin-bottom:12px;

}

.article-meta{

    font-size:13px;

    color:#777;

    margin-bottom:25px;

    padding-bottom:15px;

    border-bottom:1px solid #eee;

}

.article-body{

    font-size:16px;

    line-height:1.8;

    color:#333;

    white-space:pre-wrap;

}

.article-summary{

    font-size:17px;

    font-weight:500;

    line-height:1.7;

    color:#444;

    margin-bottom:20px;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button{

    display:inline-block;

    margin-top:25px;

    padding:10px 18px;

    background:#001f3f;

    color:white;

    text-decoration:none;

    border-radius:7px;

    font-size:14px;

    font-weight:500;

}

.back-button:hover{

    background:#174a8b;

}


/* =====================================================
   ERROR / LOADING
===================================================== */

.message{

    background:white;

    padding:30px;

    border-radius:15px;

    text-align:center;

    box-shadow:
        0 6px 20px rgba(0,0,0,.06);

}

.message h2{

    color:#001f3f;

    margin-bottom:10px;

}

.message p{

    color:#666;

}


/* =====================================================
   LIGHTBOX
===================================================== */

.lightbox{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.9);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:9999;

    padding:20px;

}

.lightbox img{

    max-width:95%;

    max-height:90%;

    border-radius:10px;

}


/* =====================================================
   PWA BAR
===================================================== */

.pwa-bar{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    background:#001f3f;

    display:none;

    justify-content:space-around;

    padding:10px 0;

    border-top:
        1px solid
        rgba(79,195,247,.3);

    z-index:10000;

}

.pwa-bar a{

    color:white;

    text-decoration:none;

    font-size:12px;

    display:flex;

    flex-direction:column;

    align-items:center;

}

.pwa-bar span{

    color:#4fc3f7;

    font-size:18px;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:768px){

    .news-header h1{

        font-size:28px;

    }

    .article-title{

        font-size:25px;

    }

    .article-content{

        padding:20px;

    }

    .article-gallery img{

        height:250px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <div class="logo">
        My<span>Jwaneng</span>
    </div>

</nav>


<!-- =====================================================
     HEADER
===================================================== -->

<section class="news-header">

    <h1>Town News</h1>

    <p>
        Stories, updates and important information
        from Jwaneng and surrounding communities.
    </p>

</section>


<!-- =====================================================
     ARTICLE
===================================================== -->

<main class="article-container">

    <div id="articleArea">

        <div class="message">

            <h2>
                Loading article...
            </h2>

            <p>
                Please wait while we load the story.
            </p>

        </div>

    </div>

</main>


<!-- =====================================================
     LIGHTBOX
===================================================== -->

<div
    class="lightbox"
    id="lightbox"
    onclick="closeLightbox()"
>

    <img
        id="lightboxImg"
        alt="News image"
    >

</div>


<!-- =====================================================
     PWA BAR
===================================================== -->

<div
    class="pwa-bar"
    id="pwaBar"
>

    <a href="index.html">

        <span>🏠</span>

        Home

    </a>


    <a href="exploremyjwaneng.html">

        <span>🔍</span>

        Explore

    </a>


    <a href="jobs.html">

        <span>💼</span>

        Jobs

    </a>


    <a href="marketplace.html">

        <span>🛒</span>

        Market

    </a>


    <a href="news.html">

        <span>📰</span>

        News

    </a>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const supabaseUrl =
    "https://jxigyoxikaqwwzfnccej.supabase.co";

const supabaseKey =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXAiLCJyZWYiOiJqeGlnb3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NjY3Mjg0MH0.P_bXYxIXkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";

const client =
    supabase.createClient(
        supabaseUrl,
        supabaseKey
    );


/* =====================================================
   ARTICLE AREA
===================================================== */

const articleArea =
    document.getElementById(
        "articleArea"
    );


/* =====================================================
   GET ARTICLE ID
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const articleId =
    urlParams.get("id");


/* =====================================================
   LIGHTBOX
===================================================== */

function openLightbox(src){

    const lightbox =
        document.getElementById(
            "lightbox"
        );

    const image =
        document.getElementById(
            "lightboxImg"
        );

    image.src = src;

    lightbox.style.display =
        "flex";

}


function closeLightbox(){

    document.getElementById(
        "lightbox"
    ).style.display =
        "none";

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date){

    if(!date){

        return "";

    }

    return new Date(date)
        .toLocaleDateString(
            "en-BW",
            {
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );

}


/* =====================================================
   LOAD ARTICLE
===================================================== */

async function loadArticle(){

    /* ---------------------------------------------
       NO ID
    --------------------------------------------- */

    if(!articleId){

        articleArea.innerHTML = `

            <div class="message">

                <h2>
                    Article not found
                </h2>

                <p>
                    No news article was specified.
                </p>

                <a
                    class="back-button"
                    href="news.html"
                >
                    ← Back to Town News
                </a>

            </div>

        `;

        return;

    }


    console.log(
        "📰 Loading news article:",
        articleId
    );


    /* ---------------------------------------------
       FETCH ARTICLE
    --------------------------------------------- */

    const {
        data,
        error
    } = await client

        .from("news")

        .select("*")

        .eq("id", articleId)

        .eq("status", "published")

        .maybeSingle();


    /* ---------------------------------------------
       DATABASE ERROR
    --------------------------------------------- */

    if(error){

        console.error(
            "❌ Could not load article:",
            error
        );

        articleArea.innerHTML = `

            <div class="message">

                <h2>
                    Unable to load article
                </h2>

                <p>
                    ${escapeHtml(error.message)}
                </p>

                <a
                    class="back-button"
                    href="news.html"
                >
                    ← Back to Town News
                </a>

            </div>

        `;

        return;

    }


    /* ---------------------------------------------
       ARTICLE NOT FOUND
    --------------------------------------------- */

    if(!data){

        articleArea.innerHTML = `

            <div class="message">

                <h2>
                    Article not found
                </h2>

                <p>
                    This article may have been removed
                    or is not currently published.
                </p>

                <a
                    class="back-button"
                    href="news.html"
                >
                    ← Back to Town News
                </a>

            </div>

        `;

        return;

    }


    /* ---------------------------------------------
       IMAGES
    --------------------------------------------- */

    let images = [];


    if(
        Array.isArray(data.images) &&
        data.images.length
    ){

        images =
            data.images;

    }
    else if(data.image_url){

        images =
            [data.image_url];

    }


    const gallery =
        images.length
            ? `

                <div class="article-gallery">

                    ${images.map(
                        image => `

                            <img
                                src="${escapeAttribute(image)}"
                                alt="${escapeAttribute(data.title || "News image")}"
                                onclick="openLightbox('${escapeAttribute(image)}')"
                            >

                        `
                    ).join("")}

                </div>

            `
            : "";


    /* ---------------------------------------------
       CONTENT
    --------------------------------------------- */

    articleArea.innerHTML = `

        <article class="article-card">

            ${gallery}

            <div class="article-content">

                ${
                    data.category
                    ? `
                        <div class="category">
                            ${escapeHtml(data.category)}
                        </div>
                      `
                    : ""
                }


                <h1 class="article-title">

                    ${escapeHtml(
                        data.title ||
                        "Untitled article"
                    )}

                </h1>


                <div class="article-meta">

                    ${formatDate(data.created_at)}

                    •

                    ${escapeHtml(
                        data.author ||
                        "Admin"
                    )}

                </div>


                ${
                    data.summary
                    ? `
                        <div class="article-summary">

                            ${escapeHtml(
                                data.summary
                            )}

                        </div>
                      `
                    : ""
                }


                <div class="article-body">

                    ${escapeHtml(
                        data.content ||
                        "No article content available."
                    )}

                </div>


                <a
                    class="back-button"
                    href="news.html"
                >
                    ← Back to Town News
                </a>

            </div>

        </article>

    `;

}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(value){

    if(value === null || value === undefined){

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHtml(value);

}


/* =====================================================
   PWA DETECTION
===================================================== */

function isPWA(){

    return window.matchMedia(
        "(display-mode: standalone)"
    ).matches

    ||

    window.navigator.standalone === true;

}


if(isPWA()){

    document.getElementById(
        "pwaBar"
    ).style.display =
        "flex";

}


/* =====================================================
   START
===================================================== */

loadArticle();

</script>

</body>

</html>
