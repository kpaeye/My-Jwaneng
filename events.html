<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Events - My Jwaneng</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ================= GLOBAL ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f7fb;
}

/* ================= NAV ================= */
.navbar{
    background:#001f3f;
    padding:18px 8%;
    color:white;
    font-size:22px;
    font-weight:700;
}

/* ================= HEADER ================= */
.header{
    padding:20px 8%;
    text-align:center;
}

.header h1{
    color:#001f3f;
    font-size:30px;
}

.header p{
    color:#666;
    font-size:14px;
}

/* ================= FILTERS ================= */
.filters{
    padding:10px 8%;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}

.filter-btn{
    padding:8px 14px;
    border:none;
    border-radius:20px;
    background:#e6e9ef;
    cursor:pointer;
    font-weight:500;
}

.filter-btn.active{
    background:#001f3f;
    color:white;
}

/* ================= GRID ================= */
.grid{
    padding:25px 8%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    max-width:1200px;
    margin:auto;
}

/* ================= CARD ================= */
.card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 6px 16px rgba(0,0,0,0.08);
    transition:0.3s;
    display:flex;
    flex-direction:column;
}

.card:hover{
    transform:translateY(-6px);
}

/* IMAGE */
.card img{
    width:100%;
    height:140px;
    object-fit:cover;
}

/* CONTENT */
.card-content{
    padding:12px;
}

.date{
    font-size:11px;
    background:#001f3f;
    color:white;
    display:inline-block;
    padding:4px 10px;
    border-radius:12px;
    margin-bottom:8px;
}

.title{
    font-size:15px;
    font-weight:600;
    color:#001f3f;
    margin-bottom:6px;
}

.desc{
    font-size:13px;
    color:#555;
    margin-bottom:10px;
}

.tag{
    font-size:11px;
    background:#f0f0f0;
    padding:3px 8px;
    border-radius:12px;
}

/* BUTTONS */
.btn{
    width:100%;
    padding:8px;
    border:none;
    border-radius:8px;
    background:#001f3f;
    color:white;
    font-size:12px;
    margin-top:10px;
    cursor:pointer;
}

/* ================= MODAL ================= */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-box{
    background:white;
    width:90%;
    max-width:450px;
    border-radius:14px;
    overflow:hidden;
}

.modal-box img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.modal-content{
    padding:15px;
}

.modal-content h2{
    color:#001f3f;
    margin-bottom:5px;
}

.modal-content p{
    font-size:13px;
    margin-bottom:6px;
    color:#555;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.rsvp{
    flex:1;
    padding:8px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

.going{
    background:#28a745;
    color:white;
}

.interested{
    background:#ff9800;
    color:white;
}

.share{
    background:#001f3f;
    color:white;
}

/* CLOSE */
.close{
    width:100%;
    padding:10px;
    border:none;
    background:#ddd;
    cursor:pointer;
}

/* FOOTER */
footer{
    background:#001f3f;
    color:white;
    padding:18px;
    margin-top:30px;
    text-align:center;
}

</style>
</head>

<body>

<div class="navbar">My Jwaneng Events</div>

<div class="header">
    <h1>Upcoming Events</h1>
    <p>Discover what's happening in your town</p>
</div>

<!-- FILTERS -->
<div class="filters">
    <button class="filter-btn active" onclick="filterEvents('all', this)">All</button>
    <button class="filter-btn" onclick="filterEvents('Music', this)">Music</button>
    <button class="filter-btn" onclick="filterEvents('Business', this)">Business</button>
    <button class="filter-btn" onclick="filterEvents('Community', this)">Community</button>
    <button class="filter-btn" onclick="filterEvents('Sports', this)">Sports</button>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-box">
        <img id="m_img" src="">
        <div class="modal-content">

            <h2 id="m_title"></h2>
            <p id="m_date"></p>
            <p id="m_category"></p>
            <p id="m_location"></p>
            <p id="m_desc"></p>

            <div class="modal-actions">
                <button class="rsvp going">Going</button>
                <button class="rsvp interested">Interested</button>
                <button class="rsvp share" onclick="shareEvent()">Share</button>
            </div>

            <button class="close" onclick="closeModal()">Close</button>

        </div>
    </div>
</div>

<!-- FOOTER -->
<footer>
© 2026 My Jwaneng | Powered by A-eye Group
</footer>

<script>

const supabaseUrl = "https://jxigyoxikaqwwzfnccej.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";
const client = supabase.createClient(supabaseUrl, supabaseKey);

let allEvents = [];
let currentEvent = null;

/* LOAD */
async function loadEvents(){
    const { data } = await client.from("events").select("*");
    allEvents = data || [];
    render(allEvents);
}

/* RENDER */
function render(list){

    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    list.forEach(ev => {

        grid.innerHTML += `
        <div class="card">

            <img src="${ev.image_url || 'https://via.placeholder.com/400'}">

            <div class="card-content">

                <div class="date">${ev.date || ""}</div>

                <div class="title">${ev.title || ""}</div>

                <div class="desc">${(ev.description || "").substring(0,60)}...</div>

                <span class="tag">${ev.category || ""}</span>

                <button class="btn" onclick='openModal(${JSON.stringify(ev)})'>
                    View Details
                </button>

            </div>

        </div>`;
    });
}

/* FILTER */
function filterEvents(cat, btn){

    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    if(cat === "all"){
        render(allEvents);
    } else {
        render(allEvents.filter(e => e.category === cat));
    }
}

/* MODAL */
function openModal(ev){
    currentEvent = ev;

    document.getElementById("modal").style.display = "flex";
    document.getElementById("m_img").src = ev.image_url || "https://via.placeholder.com/400";
    document.getElementById("m_title").innerText = ev.title || "";
    document.getElementById("m_date").innerText = "Date: " + (ev.date || "");
    document.getElementById("m_category").innerText = "Category: " + (ev.category || "");
    document.getElementById("m_location").innerText = "Location: " + (ev.location || "");
    document.getElementById("m_desc").innerText = ev.description || "";
}

function closeModal(){
    document.getElementById("modal").style.display = "none";
}

/* SHARE */
function shareEvent(){
    if(!currentEvent) return;

    const text = `Check out this event: ${currentEvent.title} on My Jwaneng`;
    navigator.clipboard.writeText(text);
    alert("Event copied to clipboard!");
}

/* INIT */
loadEvents();

</script>

</body>
</html>
