<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Jwaneng - Businesses</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f7fb;
    padding-top:70px;
}

/* NAV */
.navbar{
    background:#001f3f;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    position:fixed;
    top:0;
    width:100%;
    z-index:1500;
}

.logo{color:white;font-size:28px;font-weight:700;}
.logo span{color:#4fc3f7;}

/* HEADER */
.biz-header{
    background:linear-gradient(to right,#001f3f,#003566);
    color:white;
    padding:60px 8%;
    text-align:center;
}

/* CONTROLS */
.biz-controls{
    padding:20px 8%;
}

.search-box{
    display:flex;
    gap:10px;
}

.search-box input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
}

.search-box button{
    padding:12px 18px;
    background:#001f3f;
    color:white;
    border:none;
    border-radius:10px;
}

/* CATEGORY BUTTON */
.category-btn{
    margin-top:12px;
    background:white;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    cursor:pointer;
    font-weight:600;
}

/* GRID */
.biz-grid{
    padding:20px 8% 80px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:18px;
}

.biz-card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    cursor:pointer;
}

.biz-img{height:150px;}
.biz-img img{width:100%;height:100%;object-fit:cover;}

.biz-content{padding:12px;}
.biz-name{font-weight:700;color:#001f3f;}
.biz-category{font-size:12px;color:#4fc3f7;margin-bottom:6px;}
.biz-details{font-size:12px;color:#555;line-height:1.6;}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    background:white;
    width:90%;
    max-width:500px;
    padding:20px;
    border-radius:12px;
    max-height:80vh;
    overflow:auto;
}

/* CATEGORY LIST */
.cat-list button{
    width:100%;
    padding:10px;
    margin:4px 0;
    border:none;
    background:#f1f1f1;
    border-radius:8px;
    cursor:pointer;
    text-align:left;
}

.cat-list button:hover{
    background:#001f3f;
    color:white;
}

.close-btn{
    width:100%;
    margin-top:10px;
    padding:12px;
    background:#777;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

/* ================= FOOTER ================= */
footer{
    background:rgba(0,31,63,0.95);
    color:#fff;
    padding:60px 8% 30px;
}

.footer-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:35px;
}

.footer-column h3{
    color:#4fc3f7;
    margin-bottom:15px;
    font-size:18px;
}

.footer-column p,
.footer-column a{
    color:#ddd;
    font-size:14px;
    text-decoration:none;
}

.footer-column a:hover{
    color:#4fc3f7;
}

.footer-column ul{
    list-style:none;
}

.footer-column li{
    margin-bottom:10px;
}

.footer-bottom{
    text-align:center;
    color:#ccc;
    font-size:13px;
    margin-top:20px;
}

.footer-bottom span{
    color:#4fc3f7;
    font-weight:700;
}

/* ================= PWA CONTROL BAR ================= */
.pwa-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:rgba(0,31,63,0.98);
    display:none;
    justify-content:space-around;
    padding:10px 0;
    border-top:1px solid rgba(79,195,247,0.3);
    z-index:10000;
}

.pwa-bar a{
    color:#fff;
    text-decoration:none;
    font-size:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
}

.pwa-bar span{
    color:#4fc3f7;
    font-size:18px;
}

/* ACTION BUTTONS */
.action-btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    margin-top:8px;
    cursor:pointer;
    font-weight:600;
}

.call-btn{background:#001f3f;color:white;}
.wa-btn{background:#25D366;color:white;}
.dir-btn{background:#4fc3f7;color:#001f3f;}

</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">My<span>Jwaneng</span></div>
</nav>

<section class="biz-header">
    <h1>Local Businesses</h1>
    <p>Discover trusted businesses in Jwaneng</p>
</section>

<section class="biz-controls">

    <div class="search-box">
        <input id="searchInput" placeholder="Search businesses...">
        <button onclick="searchBiz()">Search</button>
    </div>

    <button class="category-btn" onclick="openCatModal()">
        📂 Choose Category
    </button>

</section>

<div class="biz-grid" id="grid"></div>

<!-- CATEGORY MODAL -->
<div class="modal" id="catModal">
    <div class="modal-content">

        <h3>Select Category</h3>

        <div class="cat-list" id="catList"></div>

        <button class="close-btn" onclick="closeCatModal()">Close</button>

    </div>
</div>

<!-- BUSINESS MODAL -->
<div class="modal" id="bizModal">
    <div class="modal-content">

        <h3 id="bizTitle"></h3>

        <div id="bizInfo" style="font-size:14px;line-height:1.6;"></div>

        <button id="callBtn" class="action-btn call-btn">📞 Call</button>
        <button id="waBtn" class="action-btn wa-btn">💬 WhatsApp</button>
        <button id="dirBtn" class="action-btn dir-btn">📍 Directions</button>

        <button class="close-btn" onclick="closeBiz()">Close</button>

    </div>
</div>

<script>

const supabaseUrl = "https://jxigyoxikaqwwzfnccej.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let allBusinesses = [];

const categories = [
"Accommodation","Agriculture","Automotive","Beauty & Wellness",
"Business Services","Cleaning Services","Construction","Education",
"Engineering","Entertainment","Food & Beverage","Health",
"Hospitality","Mining","Retail","Security","Services",
"Technology","Transport"
].sort();

/* ================= LOAD ================= */
async function loadBusinesses(){
    const { data } = await supabaseClient.from("businesses").select("*");
    allBusinesses = data || [];
    render(allBusinesses);
}

/* ================= GRID ================= */
function render(list){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    list.forEach(b=>{

        grid.innerHTML += `
        <div class="biz-card" onclick="openBusiness('${b.name}')">

            <div class="biz-img">
                <img src="${b.image_url || 'https://via.placeholder.com/400'}">
            </div>

            <div class="biz-content">
                <div class="biz-name">${b.name}</div>
                <div class="biz-category">${b.category}</div>
                <div class="biz-details">
                    📞 ${b.phone || 'N/A'}<br>
                    📍 ${b.location || 'N/A'}
                </div>
            </div>

        </div>`;
    });
}

/* ================= SEARCH ================= */
function searchBiz(){
    const q = document.getElementById("searchInput").value.toLowerCase();
    render(allBusinesses.filter(b =>
        (b.name || "").toLowerCase().includes(q)
    ));
}

/* ================= CATEGORY ================= */
function openCatModal(){
    document.getElementById("catModal").style.display="flex";

    const list = document.getElementById("catList");
    list.innerHTML = "";

    list.innerHTML += `<button onclick="filterCategory('All')">🌍 All Businesses</button>`;

    categories.forEach(c=>{
        list.innerHTML += `<button onclick="filterCategory('${c}')">${c}</button>`;
    });
}

function closeCatModal(){
    document.getElementById("catModal").style.display="none";
}

function filterCategory(cat){
    closeCatModal();
    if(cat === "All") return render(allBusinesses);
    render(allBusinesses.filter(b => b.category === cat));
}

/* ================= BUSINESS MODAL ================= */
function openBusiness(name){
    const b = allBusinesses.find(x => x.name === name);
    if(!b) return;

    document.getElementById("bizTitle").innerText = b.name;

    document.getElementById("bizInfo").innerHTML = `
        <b>Category:</b> ${b.category || 'N/A'}<br><br>
        📞 ${b.phone || 'N/A'}<br>
        📍 ${b.location || 'N/A'}<br>
        🌐 ${b.website || 'N/A'}<br>
        ✉️ ${b.email || 'N/A'}<br><br>
        📝 ${b.description || ''}
    `;

    // CALL
    document.getElementById("callBtn").onclick = () => {
        if(b.phone) window.location.href = `tel:${b.phone}`;
    };

    // WHATSAPP
    document.getElementById("waBtn").onclick = () => {
        const num = (b.whatsapp || b.phone || "").replace(/\D/g,'');
        if(num) window.open(`https://wa.me/${num}`, "_blank");
    };

    // DIRECTIONS
    document.getElementById("dirBtn").onclick = () => {
        if(b.location){
            const q = encodeURIComponent(b.location);
            window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, "_blank");
        }
    };

    document.getElementById("bizModal").style.display="flex";
}

function closeBiz(){
    document.getElementById("bizModal").style.display="none";
}

/* ================= INIT ================= */
loadBusinesses();

</script>
<script src="pwa-bar.js"></script>
<footer style="text-align:center;padding:20px;font-size:12px;color:#777;">
    &copy; 2026 My Jwaneng. All rights reserved.
</footer>
<!-- PWA CONTROL BAR -->
<div class="pwa-bar" id="pwaBar">
    <a href="index.html"><span>🏠</span>Home</a>
    <a href="exploremyjwaneng.html"><span>🔍</span>Explore</a>
    <a href="jobs.html"><span>💼</span>Jobs</a>
    <a href="marketplace.html"><span>🛒</span>Market</a>
    <a href="townnews.html"><span>📰</span>News</a>
</div>
</body>
</html>
