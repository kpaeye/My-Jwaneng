<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Jwaneng Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #f4f6f9;
}

.sidebar {
  width: 220px;
  background: #0b1f3a;
  color: white;
  height: 100vh;
  padding: 20px;
  position: fixed;
}

.sidebar a {
  display: block;
  color: white;
  padding: 10px;
  margin-bottom: 5px;
  cursor: pointer;
  text-decoration: none;
}

.sidebar a:hover { background: #1d3b66; }

.main {
  margin-left: 240px;
  padding: 20px;
  width: 100%;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  margin: 8px 0 15px;
}

button {
  background: #0b1f3a;
  color: white;
  padding: 10px;
  border: none;
  cursor: pointer;
}

.hidden { display: none; }

.item {
  padding: 10px;
  border-bottom: 1px solid #eee;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>Admin</h2>
  <a onclick="showSection('news')">News</a>
  <a onclick="showSection('updates')">Updates</a>
  <a onclick="showSection('events')">Events</a>
  <a onclick="showSection('jobs')">Jobs</a>
  <a onclick="showSection('marketplace')">Marketplace</a>
  <a onclick="showSection('businesses')">Businesses</a>
</div>

<div class="main">

<!-- NEWS -->
<div id="news" class="section">
  <div class="card">
    <h3>Add News</h3>
    <input id="news_title" placeholder="Title">
    <input id="news_category" placeholder="Category">
    <textarea id="news_summary" placeholder="Summary"></textarea>
    <textarea id="news_content" placeholder="Content"></textarea>
    <input id="news_image" placeholder="Image URL">
    <input id="news_author" placeholder="Author">
    <button onclick="addNews()">Publish</button>
  </div>

  <div class="card">
    <h3>Latest News</h3>
    <div id="newsList"></div>
  </div>
</div>

<!-- UPDATES -->
<div id="updates" class="section hidden">
  <div class="card">
    <h3>Add Update</h3>
    <select id="update_type">
      <option>alert</option>
      <option>announcement</option>
      <option>notice</option>
    </select>
    <textarea id="update_message"></textarea>
    <button onclick="addUpdate()">Post</button>
  </div>

  <div class="card">
    <h3>Latest Updates</h3>
    <div id="updateList"></div>
  </div>
</div>

<!-- EVENTS -->
<div id="events" class="section hidden">
  <div class="card">
    <h3>Add Event</h3>
    <input id="event_title">
    <select id="event_category">
      <option>Music</option>
      <option>Sports</option>
      <option>Business</option>
    </select>
    <input id="event_date" type="date">
    <input id="event_location">
    <textarea id="event_description"></textarea>
    <input id="event_image">
    <button onclick="addEvent()">Publish</button>
  </div>

  <div class="card">
    <h3>Events</h3>
    <div id="eventList"></div>
  </div>
</div>

<!-- JOBS -->
<div id="jobs" class="section hidden">
  <div class="card">
    <h3>Add Job</h3>
    <input id="job_title">
    <input id="job_company">
    <input id="job_location">
    <textarea id="job_description"></textarea>
    <button onclick="addJob()">Post</button>
  </div>

  <div class="card">
    <h3>Jobs</h3>
    <div id="jobList"></div>
  </div>
</div>

<!-- MARKETPLACE -->
<div id="marketplace" class="section hidden">
  <div class="card">
    <h3>Add Item</h3>
    <input id="mp_title">
    <input id="mp_price">
    <textarea id="mp_description"></textarea>
    <button onclick="addMarketplace()">Post</button>
  </div>

  <div class="card">
    <h3>Items</h3>
    <div id="mpList"></div>
  </div>
</div>

<!-- BUSINESSES -->
<div id="businesses" class="section hidden">
  <div class="card">
    <h3>Add Business</h3>
    <input id="biz_name">
    <input id="biz_category">
    <input id="biz_phone">
    <textarea id="biz_description"></textarea>
    <button onclick="addBusiness()">Add</button>
  </div>

  <div class="card">
    <h3>Businesses</h3>
    <div id="bizList"></div>
  </div>
</div>

</div>

<script>
const supabaseUrl = "https://jxigyoxikaqwwzfnccej.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";
const client = supabase.createClient(supabaseUrl, supabaseKey);

/* NAV */
function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

/* ================= NEWS ================= */
async function addNews(){
  const { error } = await client.from("news").insert([{
    title: news_title.value,
    category: news_category.value,
    summary: news_summary.value,
    content: news_content.value,
    image_url: news_image.value,
    author: news_author.value
  }]);

  if(error) return alert(error.message);

  alert("News added!");
  loadNews();
}

async function loadNews(){
  let { data } = await client.from("news").select("*").order("id",{ascending:false});
  newsList.innerHTML = data.map(n =>
    `<div class="item"><b>${n.title}</b><br>${n.summary}</div>`
  ).join("");
}

/* ================= UPDATES ================= */
async function addUpdate(){
  const { error } = await client.from("updates").insert([{
    type: update_type.value,
    message: update_message.value
  }]);

  if(error) return alert(error.message);

  alert("Update posted!");
  loadUpdates();
}

async function loadUpdates(){
  let { data } = await client.from("updates").select("*").order("id",{ascending:false});
  updateList.innerHTML = data.map(u =>
    `<div class="item"><b>${u.type}</b>: ${u.message}</div>`
  ).join("");
}

/* ================= EVENTS ================= */
async function addEvent(){
  const { error } = await client.from("events").insert([{
    title: event_title.value,
    category: event_category.value,
    date: event_date.value,
    location: event_location.value,
    description: event_description.value,
    image_url: event_image.value
  }]);

  if(error) return alert(error.message);

  alert("Event added!");
  loadEvents();
}

async function loadEvents(){
  let { data } = await client.from("events").select("*").order("id",{ascending:false});
  eventList.innerHTML = data.map(e =>
    `<div class="item"><b>${e.title}</b> - ${e.date}</div>`
  ).join("");
}

/* ================= JOBS ================= */
async function addJob(){
  const { error } = await client.from("jobs").insert([{
    title: job_title.value,
    company: job_company.value,
    location: job_location.value,
    description: job_description.value
  }]);

  if(error) return alert(error.message);

  alert("Job added!");
  loadJobs();
}

async function loadJobs(){
  let { data } = await client.from("jobs").select("*").order("id",{ascending:false});
  jobList.innerHTML = data.map(j =>
    `<div class="item"><b>${j.title}</b> - ${j.company}</div>`
  ).join("");
}

/* ================= MARKETPLACE ================= */
async function addMarketplace(){
  const { error } = await client.from("marketplace").insert([{
    title: mp_title.value,
    price: mp_price.value,
    description: mp_description.value
  }]);

  if(error) return alert(error.message);

  alert("Item added!");
  loadMarketplace();
}

async function loadMarketplace(){
  let { data } = await client.from("marketplace").select("*").order("id",{ascending:false});
  mpList.innerHTML = data.map(m =>
    `<div class="item"><b>${m.title}</b> - ${m.price}</div>`
  ).join("");
}

/* ================= BUSINESSES ================= */
async function addBusiness(){
  const { error } = await client.from("businesses").insert([{
    name: biz_name.value,
    category: biz_category.value,
    phone: biz_phone.value,
    description: biz_description.value
  }]);

  if(error) return alert(error.message);

  alert("Business added!");
  loadBusinesses();
}

async function loadBusinesses(){
  let { data } = await client.from("businesses").select("*").order("id",{ascending:false});
  bizList.innerHTML = data.map(b =>
    `<div class="item"><b>${b.name}</b> - ${b.category}</div>`
  ).join("");
}

/* INIT */
window.onload = () => {
  loadNews();
  loadUpdates();
  loadEvents();
  loadJobs();
  loadMarketplace();
  loadBusinesses();
};
</script>

</body>
</html>
