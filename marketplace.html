<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Jwaneng Marketplace</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Poppins, sans-serif;
    background:#f5f7fb;
}

/* HEADER */
.header{
    background:#0b1f3a;
    color:white;
    padding:16px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
}

/* SEARCH */
.search-wrap{
    padding:10px;
    background:white;
    position:sticky;
    top:70px;
    z-index:99;
}

.search{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:10px;
}

/* CATEGORY BAR */
.cat-bar{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px;
    background:white;
    position:sticky;
    top:120px;
    z-index:98;
}

.chip{
    border:none;
    padding:8px 12px;
    border-radius:20px;
    font-size:12px;
    background:#eee;
    cursor:pointer;
    white-space:nowrap;
}

.chip.active{
    background:#0b1f3a;
    color:white;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
    padding:10px;
}

/* CARD */
.card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.card img{
    width:100%;
    height:105px;
    object-fit:cover;
}

.card-body{
    padding:10px;
}

.title{
    font-size:13px;
    font-weight:600;
    margin-bottom:4px;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.price{
    font-size:15px;
    font-weight:700;
    color:#0b1f3a;
    margin-bottom:4px;
}

.location{
    font-size:11px;
    color:#666;
    margin-bottom:6px;
}

.description{
    font-size:11px;
    color:#555;
    margin-bottom:8px;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.actions{
    display:flex;
    gap:6px;
}

.btn{
    border:none;
    background:#0b1f3a;
    color:white;
    padding:8px;
    border-radius:8px;
    font-size:11px;
    flex:1;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    z-index:999;
}

.modal-content{
    background:white;
    width:92%;
    max-width:450px;
    margin:40px auto;
    padding:18px;
    border-radius:14px;
}

input,textarea,select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:10px;
}

textarea{
    min-height:90px;
}

</style>
</head>

<body>

<div class="header">
    <h2>🛒 My Jwaneng Marketplace</h2>
    <button class="btn" onclick="openModal()">+ Post Item</button>
</div>

<!-- SEARCH -->
<div class="search-wrap">
    <input id="search" class="search" placeholder="Search items..." onkeyup="applyFilters()">
</div>

<!-- CATEGORY BAR -->
<div class="cat-bar">
    <button class="chip active" onclick="setCategory('all')">All</button>
    <button class="chip" onclick="setCategory('Electronics')">Electronics</button>
    <button class="chip" onclick="setCategory('Vehicles')">Vehicles</button>
    <button class="chip" onclick="setCategory('Property')">Property</button>
    <button class="chip" onclick="setCategory('Services')">Services</button>
    <button class="chip" onclick="setCategory('Agriculture')">Agriculture</button>
    <button class="chip" onclick="setCategory('Furniture')">Furniture</button>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">

<div class="modal-content">

<h3>Post Item</h3>

<input id="title" placeholder="Item title">
<input id="price" type="number" placeholder="Price">

<select id="category">
    <option>Electronics</option>
    <option>Vehicles</option>
    <option>Property</option>
    <option>Services</option>
    <option>Agriculture</option>
    <option>Furniture</option>
</select>

<input id="location" placeholder="Location (e.g. Jwaneng)">
<textarea id="description" placeholder="Description"></textarea>

<input type="file" id="imageFile" accept="image/*" capture="environment">

<input id="phone" placeholder="Phone">
<input id="whatsapp" placeholder="WhatsApp">
<input id="facebook" placeholder="Facebook">

<button class="btn" onclick="submitItem()">Submit</button>
<button class="btn" style="background:red;margin-top:8px;" onclick="closeModal()">Close</button>

</div>
</div>

<script>

const supabaseUrl="https://jxigyoxikaqwwzfnccej.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";

const supabaseClient =
window.supabase?.createClient
? window.supabase.createClient(supabaseUrl,supabaseKey)
: null;

let allItems=[];
let currentCategory="all";

/* LOAD */
async function loadItems(){

    const {data}=await supabaseClient
    .from("marketplace_items")
    .select("*")
    .order("created_at",{ascending:false});

    allItems=data || [];
    applyFilters();
}

/* CATEGORY */
function setCategory(cat){

    currentCategory=cat;

    document.querySelectorAll(".chip")
    .forEach(b=>b.classList.remove("active"));

    event.target.classList.add("active");

    applyFilters();
}

/* FILTER */
function applyFilters(){

    const q=document.getElementById("search").value.toLowerCase();

    let items=allItems;

    if(currentCategory!=="all"){
        items=items.filter(i=>
            (i.category||"").toLowerCase()===currentCategory.toLowerCase()
        );
    }

    items=items.filter(i=>
        (i.title||"").toLowerCase().includes(q) ||
        (i.location||"").toLowerCase().includes(q) ||
        (i.description||"").toLowerCase().includes(q)
    );

    render(items);
}

/* RENDER */
function render(items){

    const grid=document.getElementById("grid");

    if(items.length===0){
        grid.innerHTML="<p style='padding:20px'>No items found</p>";
        return;
    }

    grid.innerHTML="";

    items.forEach(item=>{

        const wa=item.whatsapp
        ? `https://wa.me/${item.whatsapp.replace(/\D/g,'')}`
        : null;

        grid.innerHTML+=`

        <div class="card">

            <img src="${item.image_url || 'https://via.placeholder.com/300'}">

            <div class="card-body">

                <div class="title">${item.title}</div>

                <div class="price">P ${item.price}</div>

                <div class="location">📍 ${item.location || 'Unknown'}</div>

                <div class="description">${item.description || ''}</div>

                <div class="actions">

                    ${
                    item.phone
                    ? `<a href="tel:${item.phone}" style="flex:1"><button class="btn">Call</button></a>`
                    : ""
                    }

                    ${
                    wa
                    ? `<a href="${wa}" target="_blank" style="flex:1"><button class="btn">WhatsApp</button></a>`
                    : ""
                    }

                </div>

            </div>

        </div>`;
    });
}

/* UPLOAD */
async function uploadImage(file){

    if(!file) return "";

    const fileName=Date.now()+"-"+file.name;

    await supabaseClient.storage
    .from("marketplace-images")
    .upload(fileName,file);

    const {data}=supabaseClient.storage
    .from("marketplace-images")
    .getPublicUrl(fileName);

    return data.publicUrl;
}

/* SUBMIT */
async function submitItem(){

    const file=document.getElementById("imageFile").files[0];
    const image_url=await uploadImage(file);

    const item={
        title:title.value,
        price:price.value,
        category:category.value,
        location:location.value,
        description:description.value,
        image_url,
        phone:phone.value,
        whatsapp:whatsapp.value,
        facebook:facebook.value,
        status:"active"
    };

    await supabaseClient
    .from("marketplace_items")
    .insert([item]);

    closeModal();
    loadItems();
}

/* MODAL */
function openModal(){
    document.getElementById("modal").style.display="block";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

document.addEventListener("DOMContentLoaded",loadItems);

</script>

</body>
</html>
