<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f6f9;
}

/* NAV */
.nav {
    background: #001f3f;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
#searchInput{
    width:100%;
    max-width:500px;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-bottom:15px;
}

.nav input,
.nav button{
    width:auto !important;
}
/* CONTAINER */
.container {
    padding: 15px;
}

/* CARD */
.market-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 12px 25px rgba(0,0,0,0.15);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    transition:0.4s;
}

.card:hover img{
    transform:scale(1.05);
}
.card-body{
    padding:14px;
}

.card-body h3{
    font-size:16px;
    margin:6px 0;
    color:#222;
}

.price{
    color:#001f3f;
    font-size:20px;
    font-weight:700;
}

.price{
    color:#001f3f;
    font-size:22px;
    font-weight:bold;
}

.categories{
    display:flex;
    gap:10px;
    overflow:auto;
    margin-bottom:15px;
}

.cat-btn{
    border:none;
    padding:10px 15px;
    border-radius:30px;
    background:#e5e7eb;
    cursor:pointer;
}

.cat-btn.active{
    background:#001f3f;
    color:white;
}
.category-badge{
    display:inline-block;
    padding:4px 10px;
    font-size:12px;
    border-radius:20px;
    background:#e6f0ff;
    color:#001f3f;
    margin-bottom:6px;
}

/* BUTTONS */
button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.btn-primary { background: #001f3f; color: white; }
.btn-green { background: green; color: white; }
.btn-blue { background: #007bff; color: white; }
.btn-red { background: red; color: white; }

/* AUTH BOX */
.auth-box{
    max-width:380px;
    margin:80px auto;
    background:rgba(255,255,255,0.95);
    padding:25px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);

.auth-box h3{
    text-align:center;
    margin-bottom:15px;
    color:#001f3f;
    font-size:22px;
}

.auth-box input{

    padding:12px;

    border-radius:10px;
    outline:none;

}

.auth-box input:focus{
    border-color:#001f3f;
    box-shadow:0 0 8px rgba(0,31,63,0.2);
}
.market-grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
 gap:16px;
}
.sell-btn{
 position:fixed;
 bottom:20px;
 right:20px;
 width:60px;
 height:60px;
 border-radius:50%;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:999;
}

.modal-content{
    background:white;
    width:90%;
    max-width:600px;
    margin:30px auto;
    border-radius:15px;
    overflow:hidden;
}


.modal-content img{
    width:100%;
    height:300px;
    object-fit:cover;
}
.modal-content input,
.modal-content select{
    width:100%;

.price {

.card {

.card-actions{

}

.card-actions a{

}

.card-actions button{
    width:100%;
    padding:10px;

.post-form{
    background:#ffffff;
    border-radius:18px;
    padding:20px;
    max-width:500px;
    margin:40px auto;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);

}

@keyframes slideUp{
    from{
        transform:translateY(20px);

    }
    to{

    }

.post-form h3{

.post-form input:focus,

    border-color:#001f3f;
    box-shadow:0 0 6px rgba(0,31,63,0.2);
}

/* file input styling */
.post-form input[type="file"]{
    background:#f5f5f5;
    padding:10px;
}

/* submit button */
.post-form .wizard-nav{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.post-form .wizard-nav button{
    flex:1;
}

.post-form button:hover{
    background:#003366;
}
@media (max-width:600px){
    .post-form{
        width:95%;
        margin:20px auto;
        padding:15px;
    }
}

.step{
    animation:fadeIn 0.3s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

#imagePreview{
    max-height:200px;

}
.post-form textarea{

    border:1px solid #ddd;
    border-radius:10px;
    resize:vertical;
    font-family:inherit;
}
#imagePreviewContainer{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:10px;
}

#imagePreviewContainer img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:10px;
}
</style>
</head>

async function uploadImage(file) {

    const fileName = `${Date.now()}-${file.name}`;

    // 1. Upload file
    const { data, error } = await client
        .storage
        .from("marketplace-images")
        .upload(fileName, file);

    if (error) {
        console.error("Upload error:", error);
        return null;
    }

    // 2. Get public URL (CORRECT WAY)
    const { data: urlData } = client
        .storage
        .from("marketplace-images")
        .getPublicUrl(fileName);

    return urlData.publicUrl;
}

window.filterListings = function() {

    const term = document.getElementById("searchInput").value.toLowerCase();

    let filtered = allListings.filter(item => {

        const matchesCategory =

            item.category === window.selectedCategory;

        return matchesSearch && matchesCategory;
    });

    renderListings(filtered);
};

window.submitListing = async function () {
window.editingListingId = null;
    const { data: userData } = await client.auth.getUser();
    const user = userData.user;

    if (!user) {
        alert("Please login first");
        return;
    }

    // SAFE GETTERS (prevents null crash)
    const get = (id) => {
        const el = document.getElementById(id);
        return el ? el.value : "";
    };

    const files =
    [...document.getElementById("postImageFile").files];
    const file = files[0]   ;

    let imageUrls = [];

for(const file of files){

    const url = await uploadImage(file);

    if(url){
        imageUrls.push(url);
    }
}

    const listing = {
        title: get("postTitle"),
        price: get("postPrice"),
        location: get("postLocation") || "",
        description: get("postDescription") || "",
        image_url: imageUrls[0] || "",
image_urls: imageUrls,
        whatsapp: get("postWhatsapp"),
        phone: get("postPhone"),
        category: get("postCategory"),
        seller_name: get("postSellerName"),
        user_id: user.id
    };

    // DEBUG (VERY IMPORTANT)
    console.log("Submitting listing:", listing);

    const { error } = await client
        .from("listings")
        .insert(listing);

    if (error) {
        alert(error.message);
        console.error(error);
        return;
    }

    alert("Item posted successfully!");

    closePostModal();
    loadListings();
};


let currentStep = 1;

function showStep(step){

    document.querySelectorAll(".step")
        .forEach(s => s.style.display = "none");

    document.querySelector(".step-" + step)
        .style.display = "block";

    document.getElementById("stepIndicator").innerText =
        "Step " + step + " of 4";

    document.getElementById("nextBtn").style.display =
        step === 4 ? "none" : "block";

    document.getElementById("submitBtn").style.display =
        step === 4 ? "block" : "none";
}

function nextStep(){

    if(currentStep < 4){
        currentStep++;
        showStep(currentStep);

        if(currentStep === 4){
            generatePreview();
        }
    }
}

function prevStep(){

    if(currentStep > 1){
        currentStep--;
        showStep(currentStep);
    }
}

function previewImages(event){

    const files = [...event.target.files];

    if(files.length > 5){
        alert("Maximum 5 photos allowed");
        event.target.value = "";
        return;
    }

    const container =
        document.getElementById("imagePreviewContainer");

    container.innerHTML = "";

    files.forEach(file => {

        const img = document.createElement("img");

        img.src = URL.createObjectURL(file);

        container.appendChild(img);
    });
}
function generatePreview(){

    const preview = document.getElementById("previewBox");

    preview.innerHTML = `
        <h3>${document.getElementById("postTitle").value}</h3>
        <p><b>Price:</b> P${document.getElementById("postPrice").value}</p>
        <p><b>Location:</b> ${document.getElementById("postLocation").value}</p>
        <p><b>Category:</b> ${document.getElementById("postCategory").value}</p>
        <p><b>WhatsApp:</b> ${document.getElementById("postWhatsapp").value}</p>
        <p><b>Phone:</b> ${document.getElementById("postPhone").value}</p>
        <p><b>Seller:</b> ${document.getElementById("postSellerName").value}</p>
        <p><b>Description:</b> ${document.getElementById("postDescription").value}</p>
    `;
}

window.openPostModal = function(){
    document.getElementById("postModal").style.display = "block";
    currentStep = 1;
    showStep(currentStep);
};

window.editListing = async function(id){

    const { data, error } = await client
        .from("listings")
        .select("*")
        .eq("id", id)
        .single();

    if(error){
        alert(error.message);
        return;
    }

    const item = data;

    window.editingListingId = id;

    openPostModal();

    // Fill Step 1
    document.getElementById("postTitle").value = item.title || "";
    document.getElementById("postPrice").value = item.price || "";
    document.getElementById("postLocation").value = item.location || "";
    document.getElementById("postCategory").value = item.category || "Other";

    // Step 3
    document.getElementById("postDescription").value = item.description || "";
    document.getElementById("postWhatsapp").value = item.whatsapp || "";
    document.getElementById("postPhone").value = item.phone || "";
    document.getElementById("postSellerName").value = item.seller_name || "";

    // Reset wizard to step 1
    currentStep = 1;
    showStep(currentStep);

    const submitBtn = document.getElementById("submitBtn");

if(window.editingListingId){
    submitBtn.innerText = "Update Item";
} else {
    submitBtn.innerText = "Post Item";
}
};
</script>
<div id="listingModal" class="modal">

<div class="modal-content">

<span onclick="closeModal()" class="close">&times;</span>

<img id="modalImage">

<h2 id="modalTitle"></h2>

<h3 id="modalPrice"></h3>

<p id="modalLocation"></p>

<p id="modalDescription"></p>

<div id="modalButtons"></div>

</div>
</div>
<div id="postModal" class="modal">

<div class="modal-content post-form">

<span onclick="closePostModal()" class="close">&times;</span>

<h3>🛒 Create Listing</h3>

<!-- STEP INDICATOR -->
<div id="stepIndicator" style="text-align:center;margin-bottom:10px;font-size:13px;color:#666;">
    Step 1 of 4
</div>

<!-- STEP 1 -->
<div class="step step-1">
    <input id="postTitle" placeholder="Product Title">
    <input id="postPrice" placeholder="Price">
    <input id="postLocation" placeholder="Location">

    <select id="postCategory">
        <option>Vehicles</option>
        <option>Property</option>
        <option>Electronics</option>
        <option>Furniture</option>
        <option>Jobs</option>
        <option>Services</option>
        <option>Other</option>
    </select>
</div>

<!-- STEP 2 -->
<div class="step step-2" style="display:none;">
   <input
    type="file"
    id="postImageFile"
    accept="image/*"
    multiple
    onchange="previewImages(event)">
    <div id="imagePreviewContainer"></div>
</div>
<!-- STEP 3 -->
<div class="step step-3" style="display:none;">
    <textarea id="postDescription"
     placeholder="Describe your item..."
    rows="4"></textarea>
    <input id="postWhatsapp" placeholder="WhatsApp Number">
    <input id="postPhone" placeholder="Phone Number">
    <input id="postSellerName" placeholder="Seller Name">
</div>


<!-- STEP 4 -->
<div class="step step-4" style="display:none;">
    <div id="previewBox" style="background:#f5f5f5;padding:10px;border-radius:10px;"></div>
</div>

<!-- NAVIGATION -->
<div class="wizard-nav">

    <button class="btn-blue" onclick="prevStep()">
        Back
    </button>

    <button class="btn-primary" onclick="nextStep()" id="nextBtn">
        Next
    </button>

    <button class="btn-green"
            onclick="submitListing()"
            style="display:none;"
            id="submitBtn">
        Post Item
    </button>

</div>
</div>
</div>
</body>
</html>
