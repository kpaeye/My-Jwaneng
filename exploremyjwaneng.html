<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explore My Jwaneng</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f7fb;

    /* IMPORTANT: prevents footer being hidden by PWA bar */
    padding-bottom:80px;
}

/* TOP BAR */
.navbar{
    background:#001f3f;
    padding:18px 8%;
    color:white;
    font-size:22px;
    font-weight:700;
}

/* TITLE */
.header{
    padding:40px 8%;
    text-align:center;
}

.header h1{
    font-size:38px;
    color:#001f3f;
}

.header p{
    color:#666;
    margin-top:10px;
}

/* GRID */
.grid{
    padding:40px 8%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:25px;
}

/* CARDS */
.card{
    background:white;
    border-radius:25px;
    padding:35px 20px;
    text-align:center;
    text-decoration:none;
    color:#001f3f;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
    background:#001f3f;
    color:white;
}

.icon{
    font-size:55px;
    margin-bottom:15px;
}

.card h3{
    font-size:18px;
    margin-bottom:5px;
}

.card p{
    font-size:13px;
    opacity:0.8;
}

/* FOOTER TICKER */
footer{
    background:#001f3f;
    color:white;
    padding:20px 0;
    overflow:hidden;
    white-space:nowrap;
    margin-top:40px;
}

.footer-text{
    display:inline-block;
    padding-left:100%;
    animation: footerScroll 20s linear infinite;
    font-weight:500;
    font-size:15px;
}

@keyframes footerScroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-100%); }
}

/* ================= PWA CONTROL BAR ================= */
.pwa-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:rgba(0,31,63,0.98);
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-top:1px solid rgba(79,195,247,0.3);
    z-index:10000;

    transform: translateY(100%);
    opacity: 0;
    pointer-events: none;

    transition: transform 0.35s ease, opacity 0.35s ease;
}

.pwa-bar.show{
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
}

.pwa-bar a{
    color:#fff;
    text-decoration:none;
    font-size:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
}

.pwa-bar span{
    color:#4fc3f7;
    font-size:18px;
}

</style>

</head>

<body>

<div class="navbar">
    Explore My Jwaneng
</div>

<div class="header">
    <h1>Welcome to Your Digital Town</h1>
    <p>Select a service to continue</p>
</div>

<div class="grid">

    <a class="card" href="jobs.html">
        <div class="icon">💼</div>
        <h3>Jobs</h3>
        <p>Find opportunities</p>
    </a>

    <a class="card" href="marketplace.html">
        <div class="icon">🛒</div>
        <h3>Marketplace</h3>
        <p>Buy & Sell</p>
    </a>

    <a class="card" href="businesses.html">
        <div class="icon">🏢</div>
        <h3>Businesses</h3>
        <p>Local services</p>
    </a>

    <a class="card" href="events.html">
        <div class="icon">📅</div>
        <h3>Events</h3>
        <p>What's happening</p>
    </a>

    <a class="card" href="townnews.html">
        <div class="icon">📰</div>
        <h3>News</h3>
        <p>Community updates</p>
    </a>

</div>

<footer>
    <div class="footer-text">
        © 2026 My Jwaneng | Powered by A-eye Group •
    </div>
</footer>

<!-- PWA CONTROL BAR -->
<div class="pwa-bar" id="pwaBar">
    <a href="index.html"><span>🏠</span>Home</a>
    <a href="exploremyjwaneng.html"><span>🔍</span>Explore</a>
    <a href="jobs.html"><span>💼</span>Jobs</a>
    <a href="marketplace.html"><span>🛒</span>Market</a>
    <a href="townnews.html"><span>📰</span>News</a>
</div>

<script>
function isRunningAsPWA() {
    return (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        window.navigator.standalone === true
    );
}

function handlePWABar() {
    const bar = document.getElementById("pwaBar");
    if (!bar) return;

    bar.classList.remove("show");

    if (isRunningAsPWA()) {
        setTimeout(() => {
            bar.classList.add("show");
        }, 200);
    }
}

window.addEventListener("load", handlePWABar);
</script>

</body>
</html>
