<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Jwaneng - Report Issues</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f7fb;
    padding-top:70px;
}

/* ================= NAV ================= */
.navbar{
    background:#001f3f;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    position:fixed;
    top:0;
    width:100%;
    z-index:1500;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:700;
}

.logo span{
    color:#4fc3f7;
}

/* ================= HEADER ================= */
.report-header{
    background:linear-gradient(to right,#001f3f,#003566);
    color:white;
    padding:60px 8%;
    text-align:center;
}

.report-header h1{
    font-size:32px;
    margin-bottom:10px;
}

.report-header p{
    font-size:14px;
    opacity:0.9;
    max-width:700px;
    margin:auto;
    line-height:1.6;
}

/* ================= GRID ================= */
.container{
    padding:30px 8% 80px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
}

/* ================= CARD ================= */
.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    cursor:pointer;
    transition:0.2s;
    text-align:center;
}

.card:hover{
    transform:translateY(-3px);
}

.card span{
    font-size:32px;
    display:block;
    margin-bottom:10px;
}

.card h3{
    font-size:16px;
    color:#001f3f;
}

/* ================= MODAL ================= */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    background:white;
    width:90%;
    max-width:450px;
    border-radius:14px;
    padding:20px;
    max-height:80vh;
    overflow:auto;
}

.modal h2{
    color:#001f3f;
    margin-bottom:5px;
}

.modal p{
    font-size:13px;
    color:#666;
    margin-bottom:15px;
    line-height:1.5;
}

.info-box{
    background:#f1f1f1;
    padding:10px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:10px;
}

/* ================= BUTTONS ================= */
.btn{
    display:block;
    padding:12px;
    border-radius:8px;
    text-align:center;
    margin-top:8px;
    font-weight:600;
    text-decoration:none;
    font-size:14px;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.sms{
    background:#ff9800;
    color:white;
}

.web{
    background:#001f3f;
    color:white;
}

.close-btn{
    margin-top:12px;
    width:100%;
    padding:12px;
    border:none;
    background:#777;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

</style>

</head>

<body>

<!-- NAV -->
<div class="navbar">
    <div class="logo">My<span>Jwaneng</span></div>
</div>

<!-- HEADER -->
<section class="report-header">
    <h1>Smart Reporting Directory</h1>
    <p>
        Quickly connect to official service providers in Botswana.
        Select an issue type to access WhatsApp, SMS, or website reporting channels instantly.
    </p>
</section>

<!-- GRID -->
<div class="container">
    <div class="grid">

        <div class="card" onclick="openIssue('Electricity')">
            <span>⚡</span>
            <h3>Electricity</h3>
        </div>

        <div class="card" onclick="openIssue('Water')">
            <span>💧</span>
            <h3>Water</h3>
        </div>

        <div class="card" onclick="openIssue('Roads')">
            <span>🛣️</span>
            <h3>Roads</h3>
        </div>

        <div class="card" onclick="openIssue('Waste')">
            <span>🗑️</span>
            <h3>Waste</h3>
        </div>

        <div class="card" onclick="openIssue('Streetlights')">
            <span>💡</span>
            <h3>Streetlights</h3>
        </div>

        <div class="card" onclick="openIssue('Other')">
            <span>📍</span>
            <h3>Other</h3>
        </div>

    </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">

        <h2 id="title">Stakeholder</h2>
        <p id="desc"></p>

        <div class="info-box" id="info"></div>

        <a id="wa" class="btn whatsapp" target="_blank">💬 WhatsApp</a>
        <a id="sms" class="btn sms">📩 SMS</a>
        <a id="web" class="btn web" target="_blank">🌐 Website</a>

        <button class="close-btn" onclick="closeModal()">Close</button>

    </div>
</div>

<script>

const data = {
    Electricity:{
        name:"Botswana Power Corporation (BPC)",
        desc:"Report power outages, faults, meter issues",
        phone:"267XXXXXXXX",
        website:"https://www.bpc.bw",
        msg:"Electricity issue in Jwaneng. Location: "
    },
    Water:{
        name:"Water Utilities Corporation (WUC)",
        desc:"Report leaks, supply interruptions",
        phone:"267XXXXXXXX",
        website:"https://www.wuc.bw",
        msg:"Water issue in Jwaneng. Location: "
    },
    Roads:{
        name:"Jwaneng Infrastructure Services",
        desc:"Report potholes and road damage",
        phone:"",
        website:"",
        msg:"Road issue in Jwaneng. Location: "
    },
    Waste:{
        name:"Waste Management Services",
        desc:"Report refuse collection issues",
        phone:"",
        website:"",
        msg:"Waste issue in Jwaneng. Location: "
    },
    Streetlights:{
        name:"Maintenance Unit",
        desc:"Report streetlight faults",
        phone:"",
        website:"",
        msg:"Streetlight issue in Jwaneng. Location: "
    },
    Other:{
        name:"General Services",
        desc:"General community issues",
        phone:"",
        website:"",
        msg:"General issue in Jwaneng. Location: "
    }
};

function openIssue(type){
    const d = data[type];

    document.getElementById("modal").style.display="flex";
    document.getElementById("title").innerText=d.name;
    document.getElementById("desc").innerText=d.desc;
    document.getElementById("info").innerText="Include your location and clear description for faster response.";

    const location="[ENTER LOCATION]";
    const text=encodeURIComponent(d.msg+location);

    document.getElementById("wa").href=`https://wa.me/${d.phone}?text=${text}`;
    document.getElementById("sms").href=`sms:${d.phone}?body=${text}`;
    document.getElementById("web").href=d.website||"#";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
