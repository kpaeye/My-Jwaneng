
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Jwaneng Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      background: #f4f6f9;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      background: #0b1f3a;
      color: white;
      height: 100vh;
      padding: 20px;
      position: fixed;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .sidebar a {
      display: block;
      color: white;
      padding: 10px;
      text-decoration: none;
      border-radius: 5px;
      margin-bottom: 5px;
      cursor: pointer;
    }

    .sidebar a:hover {
      background: #1d3b66;
    }

    /* MAIN */
    .main {
      margin-left: 240px;
      padding: 20px;
      width: 100%;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: #0b1f3a;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #163a66;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>My Jwaneng Admin</h2>

  <a onclick="showSection('news')">News</a>
  <a onclick="showSection('marketplace')">Marketplace</a>
  <a onclick="showSection('businesses')">Businesses</a>
  <a onclick="showSection('jobs')">Jobs</a>

  <hr>

  <a onclick="logout()">Logout</a>
</div>

<!-- MAIN -->
<div class="main">

  <h2>Admin Control Center</h2>

  <!-- NEWS -->
  <div id="news" class="section">
    <div class="card">
      <h3>Add News</h3>

      <input id="news_title" placeholder="Title" />
      <input id="news_category" placeholder="Category" />
      <textarea id="news_summary" placeholder="Summary"></textarea>
      <textarea id="news_content" placeholder="Content"></textarea>
      <input id="news_image" placeholder="Image URL" />
      <input id="news_author" placeholder="Publisher Name" />

      <button onclick="addNews()">Publish News</button>
    </div>
  </div>

  <!-- MARKETPLACE -->
  <div id="marketplace" class="section hidden">
    <div class="card">
      <h3>Add Marketplace Item</h3>

      <input id="mp_title" placeholder="Item Name" />
      <input id="mp_price" placeholder="Price" />
      <textarea id="mp_description" placeholder="Description"></textarea>
      <input id="mp_image" placeholder="Image URL" />
      <input id="mp_contact" placeholder="Contact Info" />

      <button onclick="addMarketplace()">Post Item</button>
    </div>
  </div>

  <!-- BUSINESSES -->
  <div id="businesses" class="section hidden">
    <div class="card">
      <h3>Add Business</h3>

      <input id="biz_name" placeholder="Business Name" />
      <input id="biz_category" placeholder="Category" />
      <input id="biz_phone" placeholder="Phone" />
      <input id="biz_email" placeholder="Email" />
      <textarea id="biz_description" placeholder="Description"></textarea>

      <button onclick="addBusiness()">Add Business</button>
    </div>
  </div>

  <!-- JOBS -->
  <div id="jobs" class="section hidden">
    <div class="card">
      <h3>Add Job</h3>

      <input id="job_title" placeholder="Job Title" />
      <input id="job_company" placeholder="Company" />
      <input id="job_location" placeholder="Location" />
      <textarea id="job_description" placeholder="Description"></textarea>
      <input id="job_closing" placeholder="Closing Date" />

      <button onclick="addJob()">Post Job</button>
    </div>
  </div>

</div>

<script>
  const supabaseUrl = "https://jxigyoxikaqwwzfnccej.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";

  const client = supabase.createClient(supabaseUrl, supabaseKey);

  // NAVIGATION
  function showSection(section) {
    document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
    document.getElementById(section).classList.remove('hidden');
  }

  // NEWS
  async function addNews() {
    const { error } = await client.from("news").insert([{
      title: document.getElementById("news_title").value,
      category: document.getElementById("news_category").value,
      summary: document.getElementById("news_summary").value,
      content: document.getElementById("news_content").value,
      image_url: document.getElementById("news_image").value,
      author: document.getElementById("news_author").value,
      status: "published"
    }]);

    if (error) {
  alert(error.message);
  console.log("FULL ERROR:", error);
}
    else alert("News published!");
  }

  // MARKETPLACE
  async function addMarketplace() {
    const { error } = await client.from("marketplace").insert([{
      title: document.getElementById("mp_title").value,
      price: document.getElementById("mp_price").value,
      description: document.getElementById("mp_description").value,
      image_url: document.getElementById("mp_image").value,
      contact: document.getElementById("mp_contact").value
    }]);

    if (error) alert("Error posting item");
    else alert("Marketplace item added!");
  }

  // BUSINESSES
  async function addBusiness() {
    const { error } = await client.from("businesses").insert([{
      name: document.getElementById("biz_name").value,
      category: document.getElementById("biz_category").value,
      phone: document.getElementById("biz_phone").value,
      email: document.getElementById("biz_email").value,
      description: document.getElementById("biz_description").value
    }]);

    if (error) alert("Error adding business");
    else alert("Business added!");
  }

  // JOBS
  async function addJob() {
    const { error } = await client.from("jobs").insert([{
      title: document.getElementById("job_title").value,
      company: document.getElementById("job_company").value,
      location: document.getElementById("job_location").value,
      description: document.getElementById("job_description").value,
      closing_date: document.getElementById("job_closing").value
    }]);

    if (error) alert("Error posting job");
    else alert("Job posted!");
  }

  function logout() {
    alert("Logout (Auth will come later)");
  }
</script>

</body>
</html>
