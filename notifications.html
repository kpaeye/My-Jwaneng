<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications - My Jwaneng</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins;
    background:#f4f6fb;
    margin:0;
}

header{
    background:#001f3f;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.notif{
    padding:12px;
    border-bottom:1px solid #eee;
}

.notif h4{
    margin:0;
    color:#001f3f;
}

.notif p{
    margin:5px 0;
    font-size:14px;
    color:#555;
}

.small{
    font-size:12px;
    color:#888;
}

.unread{
    background:#eef7ff;
}

</style>
</head>

<body>

<header>
    <h1>Notifications</h1>
</header>

<div class="container" id="notifBox">
Loading...
</div>
<script type="module">

import { supabase } from './supabase.js';

const {
    data: { session }
} = await supabase.auth.getSession();

if(!session){
    window.location.href = "login.html";
}

</script>
<script type="module">

import { getNotifications, markAsRead } from './notifications.js';

const box = document.getElementById("notifBox");

async function load(){

    const data = await getNotifications();

    box.innerHTML = "";

    data.forEach(n => {

        const div = document.createElement("div");
        div.className = "notif " + (n.is_read ? "" : "unread");

        div.innerHTML = `
            <h4>${n.title}</h4>
            <p>${n.message || ""}</p>
            <div class="small">${new Date(n.created_at).toLocaleString()}</div>
        `;

        div.onclick = async () => {
            await markAsRead(n.id);
            load();
        };

        box.appendChild(div);
    });
}

load();

</script>

</body>
</html>
