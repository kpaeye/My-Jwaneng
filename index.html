<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Jwaneng</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<meta name="theme-color" content="#0b1f3a">

<style>

/* ========================= GLOBAL ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    height:100%;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f7fb;
    color:#222;
    display:flex;
    flex-direction:column;
}

/* ========================= NAVBAR ========================= */

.navbar{
    width:100%;
    padding:18px 8%;
    background:#001f3f;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    color:#fff;
    font-size:28px;
    font-weight:700;
}

.logo span{
    color:#4fc3f7;
}

/* ========================= BUTTON ========================= */

.btn{
    padding:12px 18px;
    background:#4fc3f7;
    color:#001f3f;
    font-weight:700;
    border-radius:10px;
    text-decoration:none;
    display:inline-block;
}

/* ========================= MAIN WRAPPER ========================= */

main{
    flex:1;
}

/* ========================= HERO ========================= */

.hero{
    min-height:85vh;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:80px 8%;
    background:linear-gradient(to right,#001f3f,#003566);
    color:white;
    flex-wrap:wrap;
}

.hero-text{
    flex:1;
    min-width:300px;
}

.hero-text h1{
    font-size:60px;
    line-height:1.1;
    margin-bottom:20px;
}

.hero-text h1 span{
    color:#4fc3f7;
}

.hero-text p{
    font-size:18px;
    line-height:1.8;
    margin-bottom:30px;
    max-width:600px;
}

.hero-image{
    flex:1;
    display:flex;
    justify-content:center;
    min-width:300px;
}

.hero-image img{
    width:100%;
    max-width:500px;
}

/* ========================= FOOTER ========================= */

footer{
    background:#001f3f;
    color:white;
    padding:40px 8%;
    text-align:center;
}

/* ========================= RESPONSIVE ========================= */

@media(max-width:900px){

    .hero{
        text-align:center;
    }

    .hero-text h1{
        font-size:42px;
    }
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">My<span>Jwaneng</span></div>
</nav>

<main>

<!-- HERO -->
<section class="hero">

    <div class="hero-text">

        <h1>Connecting <span>Jwaneng</span> Digitally</h1>

        <p>
            Your smart community platform for jobs, businesses, events,
            news, and opportunities all in one place.
        </p>

        <a href="exploremyjwaneng.html" class="btn">
            Explore My Jwaneng
        </a>

    </div>

    <div class="hero-image">
        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop">
    </div>

</section>

</main>

<!-- FOOTER -->
<footer>
    © 2026 My Jwaneng | Powered by A-eye Group
</footer>

</body>
</html>
