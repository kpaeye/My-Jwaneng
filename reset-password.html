<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | My Jwaneng</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:white;
    width:90%;
    max-width:400px;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    color:#001f3f;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#001f3f;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#003366;
}

.message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
}

.success{
    color:green;
}

.error{
    color:red;
}
</style>
</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <input
        type="password"
        id="newPassword"
        placeholder="New Password">

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password">

    <button onclick="updatePassword()">
        Update Password
    </button>

    <div id="message" class="message"></div>

</div>

<script>

const supabaseUrl =
"https://jxigyoxikaqwwzfnccej.supabase.co";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";

const client =
supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function updatePassword(){

    const password =
    document.getElementById("newPassword").value;

    const confirm =
    document.getElementById("confirmPassword").value;

    const message =
    document.getElementById("message");

    message.innerHTML = "";

    if(password.length < 6){
        message.className = "message error";
        message.innerHTML =
        "Password must be at least 6 characters.";
        return;
    }

    if(password !== confirm){
        message.className = "message error";
        message.innerHTML =
        "Passwords do not match.";
        return;
    }

    const { error } =
    await client.auth.updateUser({
        password: password
    });

    if(error){
        message.className = "message error";
        message.innerHTML = error.message;
        return;
    }

    message.className = "message success";
    message.innerHTML =
    "Password updated successfully. Redirecting...";

    setTimeout(() => {
        window.location.href =
        "/marketplace.html";
    }, 2500);
}

</script>

</body>
</html>
