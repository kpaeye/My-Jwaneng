<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Jwaneng - Town News</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0b1f3a">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ================= GLOBAL ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f4f6fb;
    color:#222;
    padding-bottom:70px;
}

/* ================= NAVBAR ================= */
.navbar{
    background:#001f3f;
    padding:16px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    color:white;
    font-size:26px;
    font-weight:700;
}

.logo span{
    color:#4fc3f7;
}

/* ================= HEADER ================= */
.news-header{
    background:linear-gradient(135deg,#001f3f,#003566);
    color:white;
    padding:50px 8%;
    text-align:center;
}

.news-header h1{
    font-size:42px;
    margin-bottom:10px;
}

.news-header p{
    max-width:700px;
    margin:auto;
    opacity:0.9;
}

/* ================= FEED ================= */
.feed{
    max-width:750px;
    margin:0 auto;
    padding:20px 12px;
}

/* ================= FEATURED ================= */
.featured{
    background:white;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

/* ================= CARD ================= */
.card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.06);
}

/* ================= IMAGE GALLERY ================= */
.gallery{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
    flex:0 0 100%;
    scroll-snap-align:start;
    cursor:pointer;
}

/* ================= CONTENT ================= */
.content{
    padding:16px;
}

.title{
    font-size:18px;
    font-weight:700;
    color:#001f3f;
    margin-bottom:6px;
}

.meta{
    font-size:12px;
    color:#777;
    margin-bottom:10px;
}

.text{
    font-size:14px;
    color:#444;
    line-height:1.6;
}

.pill{
    display:inline-block;
    font-size:11px;
    padding:4px 10px;
    background:#eef6ff;
    color:#1a4d8f;
    border-radius:20px;
    margin-bottom:8px;
}

.read{
    display:inline-block;
    margin-top:10px;
    color:#4fc3f7;
    font-weight:600;
    text-decoration:none;
}

/* ================= LIGHTBOX ================= */
.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox img{
    max-width:95%;
    max-height:80%;
    border-radius:10px;
}

/* ================= PWA BAR ================= */
.pwa-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#001f3f;
    display:none;
    justify-content:space-around;
    padding:10px 0;
    border-top:1px solid rgba(79,195,247,0.3);
    z-index:10000;
}

.pwa-bar a{
    color:white;
    text-decoration:none;
    font-size:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.pwa-bar span{
    color:#4fc3f7;
    font-size:18px;
}

/* RESPONSIVE */
@media(max-width:768px){
    .news-header h1{font-size:30px;}
}

</style>

</head>

<body>

<!-- NAV -->
<nav class="navbar">
    <div class="logo">My<span>Jwaneng</span></div>
</nav>

<!-- HEADER -->
<section class="news-header">
    <h1>Town News</h1>
    <p>Live updates, mining news, community alerts and local stories.</p>
</section>

<!-- FEED -->
<div class="feed" id="feed"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg">
</div>

<!-- PWA BAR -->
<div class="pwa-bar" id="pwaBar">
    <a href="index.html"><span>🏠</span>Home</a>
    <a href="exploremyjwaneng.html"><span>🔍</span>Explore</a>
    <a href="jobs.html"><span>💼</span>Jobs</a>
    <a href="marketplace.html"><span>🛒</span>Market</a>
    <a href="townnews.html"><span>📰</span>News</a>
</div>

<script>

const supabaseUrl = "https://jxigyoxikaqwwzfnccej.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";
const client = supabase.createClient(supabaseUrl, supabaseKey);

const feed = document.getElementById("feed");

/* TIME AGO */
function timeAgo(date){
    const diff = (new Date() - new Date(date)) / 1000;
    const m = diff/60;
    const h = m/60;
    const d = h/24;

    if(d > 1) return Math.floor(d)+"d ago";
    if(h > 1) return Math.floor(h)+"h ago";
    if(m > 1) return Math.floor(m)+"m ago";
    return "now";
}

/* LIGHTBOX */
function openLightbox(src){
    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightboxImg").src = src;
}

function closeLightbox(){
    document.getElementById("lightbox").style.display = "none";
}

/* LOAD NEWS */
async function loadNews(){

    const { data } = await client
        .from("news")
        .select("*")
        .eq("status","published")
        .order("created_at",{ascending:false});

    feed.innerHTML = "";

    if(!data) return;

    data.forEach((n,i)=>{

        const images = n.images || (n.image_url ? [n.image_url] : []);

        const html = `
        <div class="${i===0?'featured':'card'}">

            <div class="gallery">
                ${images.map(img => `
                    <img src="${img}" onclick="openLightbox('${img}')">
                `).join('')}
            </div>

            <div class="content">

                ${n.category ? `<div class="pill">${n.category}</div>`:''}

                <div class="title">${n.title}</div>

                <div class="meta">
                    ${timeAgo(n.created_at)} • ${n.author || 'Admin'}
                </div>

                <div class="text">
                    ${n.summary || ''}
                </div>

                <a class="read" href="news-article.html?id=${n.id}">
                    Read full story →
                </a>

            </div>
        </div>`;
        
        feed.innerHTML += html;
    });
}

loadNews();

/* PWA DETECTION */
function isPWA(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
}

if(isPWA()){
    document.getElementById("pwaBar").style.display = "flex";
}

</script>

</body>
</html>
