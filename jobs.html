<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0b1f3a">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Jwaneng Jobs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body {
    font-family: Arial;
    margin: 0;
    background: #f4f6f9;
  }

  header {
    background: #0b1f3a;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
  }

  .container {
    padding: 15px;
  }

  .job-card {
    background: white;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    cursor: pointer;
  }

  .job-title {
    font-size: 18px;
    font-weight: bold;
    color: #0b1f3a;
  }

  .job-company {
    color: #555;
    margin-top: 5px;
  }

  .job-meta {
    font-size: 13px;
    color: #777;
    margin-top: 5px;
  }

  /* DETAILS VIEW */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
  }

  .modal-content {
    background: white;
    margin: 60px auto;
    padding: 20px;
    width: 90%;
    max-width: 600px;
    border-radius: 10px;
  }

  .close {
    float: right;
    cursor: pointer;
    font-size: 18px;
  }

  .apply-btn {
    display: inline-block;
    background: #0b1f3a;
    color: white;
    padding: 10px;
    border-radius: 5px;
    text-decoration: none;
    margin-top: 10px;
  }
</style>
</head>

<body>

<header>
  My Jwaneng Jobs
</header>

<div class="container" id="jobsContainer">
  Loading jobs...
</div>

<!-- MODAL -->
<div class="modal" id="jobModal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">X</span>

    <h2 id="m_title"></h2>
    <p><b>Company:</b> <span id="m_company"></span></p>
    <p><b>Location:</b> <span id="m_location"></span></p>
    <p><b>Job Type:</b> <span id="m_type"></span></p>

    <p><b>Description:</b></p>
    <p id="m_description"></p>

    <p><b>Requirements:</b></p>
    <p id="m_requirements"></p>

    <p><b>Closing Date:</b> <span id="m_closing"></span></p>

    <p><b>Contact:</b></p>
    <p id="m_contact"></p>

    <a id="m_apply" class="apply-btn" target="_blank">Apply Now</a>
  </div>
</div>

<script>
  const supabaseUrl = "https://jxigyoxikaqwwzfnccej.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4aWd5b3hpa2Fxd3d6Zm5jY2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTY4NDAsImV4cCI6MjA5NTY3Mjg0MH0.P_bXYxIXYkhwi6cfy4fwbkM_s2b9uV9j22BzftWxaAc";

  const client = supabase.createClient(supabaseUrl, supabaseKey);

  let jobsData = [];

  async function loadJobs() {
    const { data, error } = await client
      .from("jobs")
      .select("*")
      .eq("status", "active")
      .order("created_at", { ascending: false });

    if (error) {
      document.getElementById("jobsContainer").innerHTML = "Error loading jobs";
      return;
    }

    jobsData = data;
    renderJobs();
  }

  function renderJobs() {
    const container = document.getElementById("jobsContainer");
    container.innerHTML = "";

    if (jobsData.length === 0) {
      container.innerHTML = "No jobs available yet.";
      return;
    }

    jobsData.forEach((job, index) => {
      container.innerHTML += `
        <div class="job-card" onclick="openJob(${index})">
          <div class="job-title">${job.title}</div>
          <div class="job-company">${job.company}</div>
          <div class="job-meta">
            ${job.location || ""} | ${job.job_type || ""} 
          </div>
        </div>
      `;
    });
  }

  function openJob(index) {
    const job = jobsData[index];

    document.getElementById("m_title").innerText = job.title;
    document.getElementById("m_company").innerText = job.company;
    document.getElementById("m_location").innerText = job.location || "N/A";
    document.getElementById("m_type").innerText = job.job_type || "N/A";
    document.getElementById("m_description").innerText = job.description || "N/A";
    document.getElementById("m_requirements").innerText = job.requirements || "N/A";
    document.getElementById("m_closing").innerText = job.closing_date || "N/A";

    let contact = "";
    if (job.application_email) contact += "Email: " + job.application_email + "\n";
    if (job.contact_number) contact += "Phone: " + job.contact_number;

    document.getElementById("m_contact").innerText = contact || "N/A";

    // APPLY BUTTON LOGIC
    const applyBtn = document.getElementById("m_apply");

    if (job.application_link) {
      applyBtn.style.display = "inline-block";
      applyBtn.href = job.application_link;
    } else {
      applyBtn.style.display = "none";
    }

    document.getElementById("jobModal").style.display = "block";
  }

  function closeModal() {
    document.getElementById("jobModal").style.display = "none";
  }

  loadJobs();
</script>

</body>
</html>
